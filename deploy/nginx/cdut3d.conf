# 只读三维浏览服务。登录由 Python 应用校验，Nginx 不另设 Basic Auth。
limit_req_zone $binary_remote_addr zone=cdut3d_login:10m rate=10r/m;

server {
    listen 80;
    server_name 202.115.132.14;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 202.115.132.14;

    ssl_certificate     /etc/cdut3d/tls/fullchain.pem;
    ssl_certificate_key /etc/cdut3d/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cdut3d_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml model/gltf+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/login {
        limit_req zone=cdut3d_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
