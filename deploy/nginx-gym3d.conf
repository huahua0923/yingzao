#     ssl_certificate     /etc/nginx/ssl/twin.cdut.edu.cn.crt;
#     ssl_certificate_key /etc/nginx/ssl/twin.cdut.edu.cn.key;
#     # ... location / 同上 ...
# }
# server { listen 80; server_name twin.cdut.edu.cn; return 301 https://$host$request_uri; }
#
# ★ 走 443 时后端 .env 里的 GYM3D_SESSION_COOKIE_SECURE=1 才是对的（Secure cookie）。
