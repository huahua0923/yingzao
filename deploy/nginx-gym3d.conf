# 校园数字孪生平台 —— nginx 片段。
#
# ★ 形态已定（用户 2026-10-01）：**不走内网域名、不加 TLS，直接 IP:8141**。
#   所以下面那个 8141 的 server 块就是生效的那一块；
#   文末 443 的那一段是备用（将来要域名+证书时再换）。
#   ★ 配套：后端 .env 里 GYM3D_SESSION_COOKIE_SECURE 必须是 **0** ——
#     走 http 时置 1 会让浏览器不发 cookie，症状是"登录成功了但下一个请求又变匿名"。
#   ★ 配套：这机器上要开 8141 端口
#     sudo firewall-cmd --permanent --add-port=8141/tcp && sudo firewall-cmd --reload
#
# ★ 目标机上已经跑着别的站点：这份文件是**新增一个 server 块**，
#   不要动任何现有的 server 块，也不要 include 到别处去改。
#   落点通常是  /etc/nginx/conf.d/gym3d.conf
#
# ★ 反代**不需要**传 X-Forwarded-For 来「修」执行面那道闸 ——
#   那道闸已由后端 .env 里的 GYM3D_COMPUTE=0 整条关死。
#   安全不建立在「配置传对了头」上：头是请求方自己写的，本来就不能当凭据。
#
# 服务器上的落点：  /etc/nginx/conf.d/gym3d.conf
# 启用：            sudo nginx -t && sudo systemctl reload nginx

server {
    listen      8141;
    listen      [::]:8141;
    server_name _;              # 用 IP:8141 访问时不必配域名；有域名就换成 twin.cdut.edu.cn

    # 大文件（campus 的 .glb 最大 7.7 MB）走流式，不落临时盘
    client_max_body_size 16m;

    # 访问日志与错误日志分开，便于「这个站到底有没有人访问」
    access_log /var/log/nginx/gym3d.access.log;
    error_log  /var/log/nginx/gym3d.error.log;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml image/svg+xml;
    # .glb / .jpg 本身已是压缩过的二进制，再 gzip 只烧 CPU，不省字节

    location / {
        proxy_pass         http://127.0.0.1:8140;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 三维产物是静态文件，可以让浏览器长缓存；接口一律不缓存。
    location ~ ^/(api/campus/.*\.(glb|jpg|json))$ {
        proxy_pass       http://127.0.0.1:8140;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public, max-age=604800";
    }
}

# ── 有内网域名 + 证书时，把它换成下面这样，并删掉上面那个 8141 的 server ──
