[project]
name = "cdut3d"
version = "0.2.0"
description = "成都理工大学校园三维数字底座"
requires-python = ">=3.12"
dependencies = [
  "ezdxf>=1.4,<2",
  "numpy>=2.3,<3",
  "shapely>=2.1,<3",
  "trimesh>=5.1,<6",
  "pygltflib>=1.16,<2",
  "Pillow>=12,<13",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov=deploy/scripts --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["_archive", "_scratch", "过程", "packs", "demo/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

