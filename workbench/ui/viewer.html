<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>营造 · 成都理工大学</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <style>
    :root{--bg:#080d12;--line:#22303d;--ink:#e6e0d4;--muted:#8795a4;--gold:#d8b06a}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
      font:13px/1.5 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
    header{height:58px;display:flex;align-items:center;gap:16px;padding:0 22px;
      border-bottom:1px solid var(--line);background:rgba(9,15,21,.96)}
    .brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
    .brand img{width:34px;height:34px}
    .brand strong{font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:18px;
      letter-spacing:.06em;font-weight:700}
    .brand strong i{font-style:normal;color:var(--gold);padding:0 .12em}
    .brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.24em}
    .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
    .label{color:var(--muted);font-size:11px;letter-spacing:.18em}
    .nav{display:flex;align-items:stretch;height:100%;margin-left:8px}
    .nav a{display:flex;align-items:center;padding:0 17px;color:var(--muted);font-size:11px;
      letter-spacing:.1em;position:relative}
    .nav a:hover{color:var(--ink)}
    .nav a.on{color:#f0d39a}
    .nav a.on::after{content:"";position:absolute;left:17px;right:17px;bottom:-1px;height:2px;background:var(--gold)}
    .right{margin-left:auto;display:flex;align-items:center;gap:16px}
    .user{color:var(--muted);font-size:11px;letter-spacing:.08em}
    .logout{border:1px solid var(--line);background:transparent;color:var(--muted);
      padding:7px 12px;cursor:pointer;letter-spacing:.08em}
    .logout:hover{color:var(--gold);border-color:rgba(216,176,106,.48)}
    iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:var(--bg)}
    @media (max-width:720px){
      header{padding:0 12px;gap:10px}
      .brand strong{font-size:15px}.brand small,.label,.sep{display:none}
      .user{display:none}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/assets/logo.svg" alt="">
      <div><strong>营造 <i>·</i> 成都理工大学</strong><small>ARCHITECTURE MANAGEMENT</small></div>
    </div>
    <span class="sep"></span>
    <nav class="nav"><a class="on" href="/">三维浏览</a><a href="/info">房屋信息</a></nav>
    <div class="right">
      <span class="user">已登录：<b id="who">cdut2026</b></span>
      <button class="logout" id="logout" type="button">退出登录</button>
    </div>
  </header>
  <iframe src="/demo/building.html" title="成都理工大学建筑三维模型"></iframe>
  <script>
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/logout", {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json"}, body: "{}"});
      location.replace("/login");
    });
  </script>
</body>
</html>
