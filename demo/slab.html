<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第六教学楼 · 1 层楼板 — AutoCAD 出环 + Blender 拉伸</title>
<style>
  :root{
    --ground:#0c0f14; --panel:#141a23; --panel2:#1b2230; --line:#28313f;
    --ink:#e9edf4; --dim:#8b95a6; --dim2:#5d6778;
    --amber:#e0a458; --mint:#57c98a; --coral:#f2705e; --sky:#6fb2e8;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
    --cjk:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--cjk);
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--sky);text-decoration:none;border-bottom:1px dotted #3d5266}
  a:hover{color:#a9d3f5;border-bottom-color:#a9d3f5}
  code{font-family:var(--mono);font-size:12.5px;background:#0a0d12;border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:#c8d3e2}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 90px}

  header{padding:44px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);margin-bottom:12px}
  h1{margin:0 0 10px;font-size:31px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
  h1 em{font-style:normal;color:var(--amber)}
  .lede{color:var(--dim);margin:0;max-width:70ch;font-size:14.5px}

  .bar{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;margin:22px 0 0;background:var(--panel)}
  .bar>div{flex:1 1 150px;padding:11px 15px;border-right:1px solid var(--line)}
  .bar>div:last-child{border-right:0}
  .bar .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
  .bar .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:3px}
  .ok{color:var(--mint)} .no{color:var(--coral)} .wr{color:var(--amber)} .mut{color:var(--dim2)}

  h2{font-size:19px;margin:40px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);
    font-weight:600;letter-spacing:-.005em}
  h2 .n{font-family:var(--mono);color:var(--dim2);font-size:13px;margin-right:11px;font-weight:400}

  .grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  .stage{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0a0d12}
  #view{display:block;width:100%;height:470px;cursor:grab;touch-action:none}
  #view.drag{cursor:grabbing}
  .hint{position:absolute;left:13px;bottom:11px;font-family:var(--mono);font-size:11px;color:var(--dim2);
    background:rgba(10,13,18,.72);padding:4px 9px;border-radius:5px;pointer-events:none}
  .legend{position:absolute;right:13px;top:13px;font-family:var(--mono);font-size:11px;line-height:1.9;
    background:rgba(10,13,18,.78);border:1px solid var(--line);border-radius:6px;padding:8px 11px;pointer-events:none}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}

  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;overflow:hidden}
  .card+.card{margin-top:11px}
  .card .hd{display:flex;gap:10px;align-items:baseline;padding:10px 14px;background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .card .n{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
  .card .ti{font-weight:600;font-size:14px}
  .card .bd{padding:12px 14px;font-size:13.5px;color:var(--dim)}
  .card .bd b{color:var(--ink);font-weight:600}
  .files{margin:9px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:11.8px}
  .files li{padding:3px 0;border-top:1px solid #1c232e;word-break:break-all}
  .files li:first-child{border-top:0}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #1c232e}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim2);font-weight:500;position:sticky;top:0;background:var(--panel)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#19202c}
  .tw{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

  .note{border-left:3px solid var(--amber);background:#171a15;padding:13px 16px;border-radius:0 8px 8px 0;
    font-size:13.5px;color:#cfd6e0}
  .note.coral{border-left-color:var(--coral);background:#1a1512}
  .note b{color:var(--ink)}
  .note ul{margin:8px 0 0;padding-left:20px}
  .note li{margin:5px 0}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;margin:10px 0 0}
  .kv dt{font-family:var(--mono);color:var(--dim2);font-size:11.5px;white-space:nowrap}
  .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;color:#c8d3e2;word-break:break-all}

  .empty{padding:26px;text-align:center;color:var(--coral);font-family:var(--mono);font-size:13px}
  footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim2);font-size:12px}
  .sw{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
  .sw button{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
  .sw button:hover{color:var(--ink);border-color:#3b4759}
  .sw button.on{color:var(--amber);border-color:#6a4f24;background:#1d1811}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">CDUT3D · 第六教学楼（逸夫楼）· 1 层</div>
  <h1>楼板：<em>AutoCAD 出闭合环</em> → <em>Blender 拉伸成体</em></h1>
  <p class="lede">
    这一页只讲楼板一件事。环是 AutoCAD 自己算的（在图上点内部点，让边界引擎描出闭环），
    拉伸是 Blender 做的。这一页不做方法、不调几何 —— 它把两件已成的产物摆出来，数从盘上现算。
  </p>
  <div class="bar" id="bar"></div>
</header>

<h2><span class="n">01</span>看</h2>
<div class="grid2">
  <div>
    <div class="stage">
      <canvas id="view"></canvas>
      <div class="legend" id="legend"></div>
      <div class="hint">拖动旋转 · 滚轮缩放</div>
    </div>
    <div class="sw">
      <button data-th="1.05" data-ph="0.75">俯视</button>
      <button data-th="0.72" data-ph="0.95">斜视</button>
      <button data-th="1.57" data-ph="1.45">平视</button>
      <button data-th="0" data-ph="0.001">正上</button>
      <button id="wallsBtn">叠既有墙：开</button>
    </div>
  </div>
  <div>
    <div class="card">
      <div class="hd"><span class="n">现算</span><span class="ti">盘上的数</span></div>
      <div class="bd"><dl class="kv" id="kv"></dl></div>
    </div>
    <div class="card">
      <div class="hd"><span class="n">出处</span><span class="ti">产物与回执</span></div>
      <div class="bd"><ul class="files" id="files"></ul></div>
    </div>
  </div>
</div>

<h2><span class="n">02</span>流程：四步，每步的入口与产物</h2>
<div id="flow"></div>

<h2><span class="n">03</span>AutoCAD 回执（原样读回，不手打）</h2>
<div class="note" id="receipt"></div>

<h2><span class="n">04</span>逐个环</h2>
<div class="tw">
  <table id="tb">
    <thead><tr>
      <th>环</th><th class="num">面积 m²</th><th class="num">顶点</th>
      <th class="num">在 DXF 里出现</th><th class="num">外框 宽×高 mm</th><th>处置</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>

<h2><span class="n">05</span>只报不判</h2>
<div class="note coral" id="report"></div>

<footer id="foot"></footer>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const SLAB   = './_gen/c006-f1-slab';
const WALLS  = './_gen/c006_v4ctrl_walls.glb';
const RECEIPT= '../_scratch/_cad_grid/s.txt';
const $ = s => document.querySelector(s);
const N = (v,d=2) => (v===null||v===undefined||Number.isNaN(v)) ? '—'
        : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

/* ══════════ 现算：把所有数从盘上读回 ══════════ */
const state = {meta:null, receipt:null, walls:null, nwalls:0};

async function jget(u){ try{ const r=await fetch(u+'?t='+Date.now()); return r.ok? await r.json():null; }catch(e){ return null; } }
async function tget(u){ try{ const r=await fetch(u+'?t='+Date.now()); return r.ok? await r.text():null; }catch(e){ return null; } }

function parseReceipt(t){
  if(!t) return null;
  const g = k => { const m = t.match(new RegExp('^'+k+'=(.+)$','m')); return m? m[1].trim(): null; };
  const q = [...t.matchAll(/^Q\d+ M2=([\d.]+)$/gm)].map(m=>parseFloat(m[1]));
  return {
    n_hatch:g('n_hatch'), n_pline:g('n_pline'), n_region:g('n_region'),
    after_union:g('after_union'), unionM2:g('unionM2'),
    hatch_nonzero:g('hatch_nonzero'), traced_plines:g('traced_plines'),
    probes:q.length, probe_areas:[...new Set(q)].sort((a,b)=>b-a),
    done: /^DONE$/m.test(t),
  };
}

function report(){
  const m = state.meta, rc = state.receipt;
  const loops = m && m.loops ? m.loops : [];
  const outline = loops.find(l=>l.is_outline) || null;
  const others  = loops.filter(l=>!l.is_outline);
  const A = m ? m.outline_area_m2 : null;
  const E = rc && rc.unionM2 ? parseFloat(rc.unionM2)
          : (m && m.expect_m2 ? m.expect_m2 : null);
  const rel = (A!==null && E) ? Math.abs(A-E)/E*100 : null;

  /* ── 柱：把「我量的」和「AutoCAD 量的」并排 ── */
  $('#bar').innerHTML = [
    ['轮廓面积（我量的）',   A!==null? N(A,3)+' m²':'—', 'ok'],
    ['面域面积（AutoCAD 量的）', E!==null? N(E,4)+' m²':'—', 'wr'],
    ['两者相差',            rel!==null? N(rel,4)+' %':'—', (rel!==null&&rel<0.01)?'ok':'no'],
    ['轮廓顶点 DXF／进模型', outline? `${outline.verts} ／ ${m&&m.outline_verts!==undefined?m.outline_verts:'—'}`:'—', 'ok'],
    ['DXF 里的多段线',       m? m.n_plines_in_dxf : '—', 'mut'],
    ['回执跑到底',           rc? (rc.done?'DONE':'未见到 DONE'):'—', rc&&rc.done?'ok':'no'],
  ].map(([k,v,c])=>`<div><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');

  /* ── 盘上的数 ── */
  const kv = [];
  kv.push(['选的轮廓', m? m.outline : '（还没生成）']);
  kv.push(['凭什么选它', m? m.outline_reason : '—']);
  kv.push(['进模型的实体', m? m.n_loops+' 个互不相同的环 → 模型里 1 个' : '—']);
  kv.push(['单位 / 厚度', m? `${m.units}；z ${m.z0}→${m.z1} m` : '—']);
  kv.push(['毫米→米', m? `÷${m.mm_per_m}` : '—']);
  kv.push(['弧离散弦长', m? `≤${m.flatten_mm} mm` : '—']);
  kv.push(['局部原点 mm', m? `${m.origin_mm[0]}, ${m.origin_mm[1]}` : '—']);
  kv.push(['叠的既有墙', state.nwalls? `${state.nwalls} 个 mesh` : '—']);
  $('#kv').innerHTML = kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');

  /* ── 出处 ── */
  const files = [
    ['AutoCAD 命令脚本', '../_scratch/_cad_grid/g.scr'],
    ['AutoCAD 回执',     RECEIPT],
    ['AutoCAD 描出的环', '../_scratch/_cad_grid/loops.dxf'],
    ['适配器（只搬数）', '../_scratch/loops_to_prism.py'],
    ['棱柱表',           SLAB+'.json'],
    ['元数据',           SLAB+'.meta.json'],
    ['拉伸脚本（Blender）', '../tools/prism_blender.py'],
    ['成品 GLB',         SLAB+'.glb'],
  ];
  $('#files').innerHTML = files.map(([k,v])=>
    `<li>${k} → <a href="${v}" target="_blank">${v}</a></li>`).join('');

  /* ── 回执：原样读回 ── */
  $('#receipt').innerHTML = rc? `
    <b>这一跑 AutoCAD 自己报的数</b>（页面从 <code>s.txt</code> 现读现解析）：
    <dl class="kv">
      <dt>填充点总数</dt><dd>${rc.n_hatch}</dd>
      <dt>其中真有面积</dt><dd>${rc.hatch_nonzero}</dd>
      <dt>生成的边界多段线</dt><dd>${rc.n_pline}</dd>
      <dt>成面域</dt><dd>${rc.n_region}</dd>
      <dt>并集之后剩</dt><dd>${rc.after_union} 块</dd>
      <dt>并集面积</dt><dd>${rc.unionM2} m²</dd>
      <dt>描轮廓的多段线</dt><dd>${rc.traced_plines}</dd>
    </dl>`:
    `<b>回执还没生成</b>（<code>${RECEIPT}</code> 读不到）。这一跑还没结束，或已经中断 —— 数不出来就不编。`;

  /* ── 表 ── */
  const tb = $('#tb tbody');
  tb.innerHTML = loops.map(l=>{
    const w = l.bbox_mm, ww = w[2]-w[0], hh = w[3]-w[1];
    const dis = l.is_outline
      ? `<span class="ok">进模型（整层轮廓）</span>`
      : `<span class="wr">只报不判${l.inside_of_name? '，落在 '+l.inside_of_name+' 里':''}</span>`;
    return `<tr>
      <td><code>${l.name}</code></td>
      <td class="num">${N(l.area_m2,3)}</td>
      <td class="num">${l.verts}</td>
      <td class="num">${l.count}</td>
      <td class="num">${N(ww,0)} × ${N(hh,0)}</td>
      <td>${dis}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" class="mut" style="padding:18px">还没有环</td></tr>`;

  /* ── 只报不判 ── */
  $('#report').innerHTML = `
    <b>下面这些是量出来的事实，不是结论 —— 我不替它下判断。</b>
    <ul>
      <li><b>轮廓怎么定的</b>：环是从 AutoCAD 描出来的，但「哪个环算整层轮廓」不是我说了算 ——
          我把它钉在 <b>AutoCAD 自己用 ActiveX 量的面域面积</b>（回执里的 <code>unionM2</code>=${E!==null?N(E,4):'—'} m²）上，
          选中的环必须与它相符（±1%）；<b>选不中就不写产物，直接报「没量到」</b>。
          现在选中 ${m?m.outline:'—'}，我量它 ${A!==null?N(A,3):'—'} m²，相差 <b>${rel!==null?N(rel,4):'—'}%</b>
          —— 这是两套独立实现（AutoCAD 的 ActiveX 属性 vs 我在 DXF 上的鞋带公式）互证。</li>
      <li><b>没进模型的环：${others.length} 个</b>
          ${others.length? '（'+others.map(o=>`${o.name} ${N(o.area_m2,3)} m²、在 DXF 里只出现 ${o.count} 次`).join('；')+'）':''}。
          整层轮廓在 110 次探测里出现 <b>${outline?outline.count:'—'} 次</b>、每次都逐位相同；
          剩下那一个是<b>单次孤例</b>（第 0 号探测多描出来的），来源我没坐实，所以
          <b>不进模型</b>，只摆在这儿。</li>
      <li>填充点共 ${rc&&rc.n_hatch?rc.n_hatch:'—'} 个，AutoCAD 只认了
          <b>${rc&&rc.hatch_nonzero?rc.hatch_nonzero:'—'}</b> 个有面积 ——
          其余落在洞口上或楼外，AutoCAD 的原话是「未发现有效的图案填充边界」。</li>
      <li>面域并集成 <b>${rc&&rc.after_union!==undefined?rc.after_union:'—'} 块</b>，
          而外环面积 == 面域面积 ⇒ <b>这块面域没有洞</b>（否则面域面积会比外环小）。</li>
      <li><b>独立对照</b>：<code>tools/slab_sharp.py</code> 是另一套算法（形态学闭运算，
          <b>我写的，不是 AutoCAD 的</b>），给的 1 层足迹 <b>7830.62 m²</b>。
          两条路口径不同（内墙面 vs 外轮廓），<b>不该相等</b>；这里只把两个数摆在一起，
          谁对谁错不由本页裁决。</li>
    </ul>`;
  $('#foot').textContent = '本次生成 ' + new Date().toLocaleString('zh-CN') +
    ' · 数一律从盘上现读现算 · 页面是入口，不是结论';
}

/* ══════════ 流程卡 ══════════ */
function flow(){
  const steps = [
    ['01','在图上点内部点','AutoCAD',
     '把 1 层图幅（col <code>L</code>、row <code>0</code>）里的 <code>4.2墙体</code> 几何线搬进一个小 DXF，按 <b>标签点 + 5 m 网格</b> 逐个 <code>-HATCH</code>。',
     ['入口 <code>_scratch/acad.py : transport()</code>','命令 <code>_scratch/drive_acad_grid.py</code>']],
    ['02','让边界引擎描出闭环','AutoCAD',
     '对每个填充 <code>HATCHGENERATEBOUNDARY</code> → 闭合多段线；<code>REGION</code> → <code>UNION</code> 并成整块；再在并集内部点一遍，描出各壳的外环。',
     ['方法 <code>-HATCH</code> + <code>HATCHGENERATEBOUNDARY</code>' ]],
    ['03','搬数：环 → 棱柱表','适配器',
     '毫米→米、平移到局部原点、<b>弧按弦长 ≤2 mm 离散</b>（丢 bulge 会安静地少算 0.75%）。本步不产生任何新角。',
     ['入口 <code>_scratch/loops_to_prism.py</code>','输出 <code>_gen/c006-f1-slab.json</code>']],
    ['04','拉伸成体','Blender',
     '无头跑 <code>prism_blender.py</code>，底面挤成 0→0.12 m 的板。Blender 的拉伸是精确布尔：折线进、折线出，<b>直角就是直角</b>。',
     ['命令 <code>blender -b --python tools/prism_blender.py -- --in … --out …</code>']],
  ];
  $('#flow').innerHTML = steps.map(([n,ti,who,body,files])=>`
    <div class="card"><div class="hd">
      <span class="n">${n}</span><span class="ti">${ti}</span>
      <span class="mut" style="margin-left:auto;font-family:var(--mono);font-size:11px">${who}</span>
    </div><div class="bd">${body}<ul class="files">${
      files.map(f=>`<li>${f}</li>`).join('')}</ul></div></div>`).join('');
}

/* ══════════ 3D ══════════ */
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 8000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x1b2733, 2.3));
const l1 = new THREE.DirectionalLight(0xffffff, 1.7); l1.position.set(1.2,2.2,1.6); scene.add(l1);
const l2 = new THREE.DirectionalLight(0x87a8ff, 0.75); l2.position.set(-1.4,1.0,-1.2); scene.add(l2);
const grid = new THREE.GridHelper(240, 240, 0x1d2632, 0x141b25); grid.position.y=-0.6; scene.add(grid);

const slabG = new THREE.Group(); scene.add(slabG);
const wallG = new THREE.Group(); wallG.visible = true; scene.add(wallG);

const target = new THREE.Vector3();
let theta=1.05, phi=0.75, dist=180, ready=false;

function fit(){
  const bb = new THREE.Box3().setFromObject(slabG);
  if(bb.isEmpty()){ target.set(0,0,0); return; }
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  target.copy(c);
  dist = Math.max(s.x, s.z) * 0.72;
  grid.position.y = bb.min.y - 0.6;
}
function place(){
  camera.position.set(
    target.x + dist*Math.sin(phi)*Math.cos(theta),
    target.y + dist*Math.cos(phi),
    target.z + dist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);
}
function onResize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(canvas.width!==w || canvas.height!==h) renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
function tick(){ onResize(); place(); renderer.render(scene,camera); requestAnimationFrame(tick); }

const COLORS = [0xe0a458,0x6fb2e8,0x57c98a,0xc08bd8,0xe08a6f,0x7fd0c8,0xd8c15a,0x9aa7bd];
function load(url, onScene){ return new Promise(res=>{
  new GLTFLoader().load(url, g=>{ onScene(g.scene); res(g.scene); },
    undefined, e=>{ console.error(url+' 载不动', e); res(null); }); }); }

(async ()=>{
  const [meta, rec] = await Promise.all([ jget(SLAB+'.meta.json'), tget(RECEIPT) ]);
  state.meta = meta; state.receipt = parseReceipt(rec);

  const slab = await load(SLAB+'.glb', s=>{
    let i=0; const meshes=[];
    s.traverse(o=>{ if(o.isMesh) meshes.push(o); });
    meshes.forEach(o=>{
      const c = COLORS[i++ % COLORS.length];
      o.material = new THREE.MeshStandardMaterial({color:c, metalness:0.05, roughness:0.6,
        side:THREE.DoubleSide, flatShading:true});
    });
    slabG.add(s);
  });

  const walls = await load(WALLS, s=>{
    let n=0;
    s.traverse(o=>{ if(o.isMesh){ n++; o.material = new THREE.MeshStandardMaterial({
      color:0x445064, metalness:0.0, roughness:0.92, transparent:true, opacity:0.32,
      side:THREE.DoubleSide, flatShading:true}); }});
    state.nwalls = n;
    wallG.add(s);
  });

  if(!slab) $('#legend').innerHTML = '<span style="color:var(--coral)">楼板 GLB 还没生成</span>';
  else $('#legend').innerHTML = [
    ['var(--amber)','AutoCAD 描出的环 → Blender 拉伸'],
    ['#445064','既有 libs3d 墙（半透明）'],
  ].map(([c,t])=>`<div><i style="background:${c}"></i>${t}</div>`).join('');

  fit(); ready=true; tick();
  report();

  /* 机器可核的探针：headless 检查里读 window.__slab */
  const bb = new THREE.Box3().setFromObject(slabG);
  window.__slab = {
    slab: !!slab, walls: !!walls, nwalls: state.nwalls,
    meta: !!meta, receipt: !!state.receipt,
    receipt_done: !!(state.receipt && state.receipt.done),
    n_loops: meta? meta.n_loops : null,
    outline: meta? meta.outline : null,
    outline_area_m2: meta? meta.outline_area_m2 : null,
    unionM2: state.receipt? state.receipt.unionM2 : null,
    bbox: bb.isEmpty()? null
        : {min:bb.min.toArray().map(v=>+v.toFixed(3)),
           max:bb.max.toArray().map(v=>+v.toFixed(3))},
    report_drawn: $('#bar').children.length,
  };
})();

let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.classList.add('drag');
  canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{ if(!drag) return;
  theta -= (e.clientX-drag.x)*0.007;
  phi = Math.min(Math.PI-0.02, Math.max(0.02, phi-(e.clientY-drag.y)*0.007));
  drag={x:e.clientX,y:e.clientY}; });
const stop=()=>{drag=null;canvas.classList.remove('drag');};
canvas.addEventListener('pointerup',stop); canvas.addEventListener('pointercancel',stop);
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  dist = Math.min(3000, Math.max(2, dist*Math.exp(e.deltaY*0.0011))); },{passive:false});

document.querySelectorAll('.sw button[data-th]').forEach(b=>b.addEventListener('click',()=>{
  theta = parseFloat(b.dataset.th); phi = parseFloat(b.dataset.ph);
  if(phi < 0.02) phi = 0.02; if(ready) fit();
}));
$('#wallsBtn').addEventListener('click', e=>{
  wallG.visible = !wallG.visible;
  e.target.textContent = '叠既有墙：' + (wallG.visible? '开':'关');
  e.target.classList.toggle('on', !wallG.visible);
});
flow();
window.addEventListener('resize', onResize);
</script>
</body>
</html>
