repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(deploy/scripts/|tests/|tools/cleanup_system\.py|tools/build_building_status\.py|tools/archive_ops_artifacts\.py)
      - id: ruff-format
        files: ^(deploy/scripts/|tests/|tools/cleanup_system\.py|tools/build_building_status\.py|tools/archive_ops_artifacts\.py)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

