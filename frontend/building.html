// 取景外包盒：默认路径量轮廓，?su=1 直接量 spec 每件的 ext 与 z0/z1（**不伪造 loadedFloors** 去喂同一段代码）
function boundsOfFloors() {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const f of loadedFloors) for (const [x, y] of f.outline) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (!isFinite(minX)) return null;
  return { minX, maxX, minY, maxY, h: FLOOR_COUNT * LAYER_HEIGHT };
}
function boundsOfSu() {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, maxZ = 0;
  for (const p of ((suSpec && suSpec.parts) || [])) {
    for (const [x, y] of (p.ext || [])) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    if (p.z1 > maxZ) maxZ = p.z1;
  }
  if (!isFinite(minX)) return null;
  return { minX, maxX, minY, maxY, h: maxZ };
}
function frameCamera() {
  // 按当前建筑的 footprint 外包盒 + 高度自适应取景（各楼尺寸差异大，固定机位会裁切）
  const bb = boundsOfFloors() || (suMode ? boundsOfSu() : null);
  if (!bb) return;
  const w = Math.max(bb.maxX - bb.minX, 1), d = Math.max(bb.maxY - bb.minY, 1);
  const h = bb.h;
  const r = Math.hypot(w, d) * 0.5;
  const dist = Math.max(r * 1.6, h * 1.3, 30);
  const cx = (bb.minX + bb.maxX) / 2, cy = h / 2, cz = -(bb.minY + bb.maxY) / 2;
  camera.position.set(cx + dist * 0.8, cy + dist * 0.65, cz + dist * 0.8);
  controls.target.set(cx, cy, cz);
  controls.update();
}
function resetView() {
  clearSelect();
  info.style.display = 'none';
  currentFloor = 'all';
  frameCamera();
}
// 生成时间：从 index.json 的 `generated_at` 读（那是**生成方**写进账本里的时刻，
// 见 backend/gen_stamp.py / build_index.py 的 generated_of）。
// ★ `mtime-backfill` 是**从产物 mtime 推算的**，不是生成时刻（复制/同步也会改 mtime）——
//   两者必须在屏幕上分得开，否则推算值会冒充测量值；分不开就是这个字段最坏的用法。
function fmtGen(b) {
  // ★ 三种状态必须分得开，否则「没记」会看起来像「这页不管这事」：
  //     ① 清单里压根没这个字段（老清单 / LEGACY_LIHUA 兜底）→ 不显示，这页不掺和；
  //     ② 字段在、值是 null（账本里没有这栋的记录）      → 显示「生成时间未记录」；
  //     ③ 字段在、有值                                    → 显示时刻（并区分精确/推算）。
  if (!b || !('generated_at' in b)) return null;
  const at = b.generated_at;
  if (!at) {
    return { text: '生成时间未记录', approx: true,
             tip: '这栋楼的生成时间账本（data/buildings/<楼>/generated.json）里没有记录' };
  }
  const exact = b.generated_source === 'generator';
  const parts = (b && b.generated_parts) || {};
  const p = (k) => (parts[k] ? String(parts[k]).replace('T', ' ').slice(0, 16) : '—');
  return {
    text: `生成 ${String(at).replace('T', ' ').slice(0, 16)}${exact ? '' : '（推算）'}`,
    // 悬停给出分项与来路，省得一屏上塞三行
    tip: (exact ? '生成方当场盖章' : '由产物最后写入时间推算，不是生成时刻')
       + `\n  识别 floors：${p('floors')}\n  GLB：${p('glb')}\n  SU 规格：${p('su')}`,
    approx: !exact,
  };
}
function setBname(b, state, err) {
  // 「SU 规格 <sha16>」是**这条路的数据来源指纹**：算出来才写，算不出就是 '—'（绝不拿别的数冒充）。
  // 它是本页与磁盘上 data/su/<楼>.json 的唯一握手凭据 —— 回归脚本按它比对磁盘实测值。
  const label = (b.title ? `${b.title}（${b.name}）` : b.name)
              + (suMode ? ` · SU 规格 ${suSha || '—'}` : '');
  const el = document.getElementById('bname');
  // ★ 诚实显示：标题**秒变**、几何要 13~17 秒才到 —— 不标状态的话，这十几秒里画面是上一栋、
  //   标题是新楼。失败（c009 声明 6 层、floor5 是 404）时必须说"载入失败"，不能顶着新楼的名字
  //   继续显示上一栋的几何。
  if (el) {
    el.textContent = state === 'loading' ? `${label} · 载入中…`
      : state === 'failed' ? `${label} · 载入失败${err ? '：' + String(err.message || err).slice(0, 70) : ''}`
      : label;
    // 生成时间：**与上面并列**而不是拼进字符串 —— 回填值要单独压暗 + 带悬停说明。
    // 注意 `textContent =` 会清掉子节点，所以这一段必须写在它之后。
    const g = fmtGen(b);
    if (g) {
      const s = document.createElement('span');
      s.className = g.approx ? 'gen gen-approx' : 'gen';
      s.textContent = ' · ' + g.text;
      s.title = g.tip;
      el.appendChild(s);
    }
  }
  document.title = `${b.title ? b.title + ' · ' : ''}整栋立体模型`;
}
// ---------- SU 规格的加载（?su=1）----------
// ★ crypto.subtle 只在**安全上下文**可用：http://localhost 算安全，http://172.27.31.117:8123 **不算**
//   ⇒ 必须带守卫，算不出就返回 null（标题显示 '—'），**不许伪造**。
async function sha16Hex(buf) {
  try {
    if (!(typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest)) return null;
    const d = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(d)).map((x) => x.toString(16).padStart(2, '0')).join('').slice(0, 16);
  } catch (e) { console.warn('算 SU 规格 sha256 失败（非安全上下文？）', e); return null; }
}
// 楼层数从规格**自己**的 groupOrder 推：只认 `F<数字>` 那批（`屋顶/场地` 是整栋尺度，不是层）。
// 不用 index.json 的 floors：那是清单的快照，规格才是这条路上真正画出来的东西。
function suFloorCount(spec) {
  let mx = -1;
  for (const g of (((spec.meta || {}).groupOrder) || [])) {
    const m = /^F(\d+)$/.exec(String(g));
    if (m) mx = Math.max(mx, parseInt(m[1], 10));
  }
  return mx >= 0 ? mx + 1 : 1;
}
// ★ 这个函数**只**在成功时返回"这份载荷"的三样东西，一个全局都不写：
//   写入全局的是 loadBuilding 里**过了作废守卫之后**那一行 —— 否则一次被切楼作废的慢请求
//   会把它的 suSpec/suSha 留在全局里，接着画的却是另一栋（自查口 suStats 于是拿着 A 的
//   specParts 报 B 的 specUrl；这种"自己报自己"的错，判据是抓不住的）。
async function loadSuSpec(name) {
  const url = `data/su/${name}.json`;
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(res.status === 404
      ? `这栋还没有 SU 规格（缺 ${url}）` : `${url} ${res.status}`);
  }
  const buf = await res.arrayBuffer();            // 先拿字节：指纹与字节数都取自**这份**载荷
  return { spec: JSON.parse(new TextDecoder('utf-8').decode(buf)),
           sha16: await sha16Hex(buf), bytes: buf.byteLength };
}

async function loadBuilding(b) {
  // 已经是这一栋、且上一次已经落地 → 什么都不用做（少了 builtToken 这一半，"已选中"和"已画出来"会混为一谈）。
  // builtSource 也要一起比：点了「数据源」按钮时楼名没变，但几何**必须**重来一遍（交付楼层↔SU 规格）。
  if (currentBuilding === b.name && builtToken === buildToken
      && builtSource === (suMode ? 'su' : 'floors')) return;
  const my = ++buildToken;
  // ★ 载入中那串「SU 规格 <sha16>」必须是**这一栋**的：此刻还没去取，得先把上一栋的清掉 ——
  //   setBname 是**立刻**改文字的，而指纹要等 fetch 回来才算得出；不清就会出现
  //   「c006 的标题 + lihua 的指纹」并排挂着（说好的"算出来才写"当场变成假话）。
  if (suMode) { suSha = null; suBytes = 0; }
  setBname(b, 'loading');
  currentBuilding = b.name;
  try {
    if (suMode) {
      // SU 规格分支：几何**不是**本页现实现的，而是 SU 里那座楼真实存在的那 N 件。
      // 这里**不** loadSpec(b.dir)：规格里没有一处用得到建模参数（它是已成形的体，不是"中线+厚度"）。
      // 但 S 仍复位成内置常量：标注的高度公式用 S.slab_t（与 SU 规格的板顶标高一致）。
      S = Object.assign({}, DEFAULT_SPEC);
      const got = await loadSuSpec(b.name);
      if (my !== buildToken) return;        // 期间又切了别的楼 → 这次的结果作废（**连全局都不写**，见 loadSuSpec）
      suSpec = got.spec; suSha = got.sha16; suBytes = got.bytes;
      LAYER_HEIGHT = (suSpec.meta || {}).floor_h || 4.2;
      FLOOR_COUNT = suFloorCount(suSpec);
      loadedFloors = [];                    // 这条路上没有 floors JSON：取景走 boundsOfSu（见 frameCamera）
      lockWindowUI();                       // 窗参数在这条路上没有意义（SU 规格自带窗件），按钮要知道这件事
      syncPanel();
      buildFloorButtons(FLOOR_COUNT);
      resetView();
      rebuild();
      return;
    }
    S = Object.assign({}, DEFAULT_SPEC);
    await loadSpec(b.dir);
    if (my !== buildToken) return;          // 期间又切了别的楼 → 这次的结果作废（谁最后请求谁赢）
    applyStyle();
    unlockWindowUI();             // 这条路上合成窗是有意义的（对称于 su 分支的 lockWindowUI）
    LAYER_HEIGHT = S.floor_h || 4.2;
    FLOOR_COUNT = b.floors;
    const floors = await loadFloors(b.dir, b.floors);
    if (my !== buildToken) return;
    loadedFloors = floors;
    syncPanel();
    buildFloorButtons(FLOOR_COUNT);
    resetView();
    rebuild();                              // geometryBuilding / builtToken 在 rebuild 末尾置位
  } catch (err) {
    // ★ 载入失败 ⇒ 页面上**不能**留着上一栋的几何顶着这一栋的名字。原先这里只改标题就 rethrow，
    //   外层 .catch 顺手把 `data/` 里的理化楼画了出来、并给它盖了握手章（geometryBuilding/builtToken
    //   都置位）—— 失败的楼"看起来载入成功了"，自动化也认。现在失败态 = 空场景 + 不盖章：
    //   就绪握手因此永远等不到（回归里表现为 ready=timeout，命中 KNOWN_DOWN 的"按预期失败"分支）。
    if (my === buildToken) {
      setBname(b, 'failed', err);
      loadedFloors = [];            // 上一栋的楼层数据也一并丢掉：留着它，任何一次 rebuild 都会把旧楼画回来
      suSpec = null;                // SU 分支同一个道理：留着它，下一次 rebuild 会把**上一栋的 SU 几何**画回来
      suSha = null; suBytes = 0;    // 指纹同理：没画出来就不许在标题上留着上一栋的凭据（失败态显示 '—'）
      clearBuilding();
      clearSelect();
      info.style.display = 'none';
      geometryBuilding = null;      // ★ 两个握手量都留在"未就绪"：几何真换了才算数（见 rebuild 末尾）
      builtSource = null;
      // ★ 房间数据也得一起收：不收的话下拉里还列着**上一栋**的房间，而场景已经空了 ——
      //   点「规划路径」就是去算一栋不在场景里的楼。失败态要把"能点什么"一起收掉，
      //   不只是把几何清干净。（`?building=c009` 今天就会走到这里：index.json 说 6 层、floor5.json 404。）
      unloadRooms('本楼未载入，路径规划不可用');
      renderLegend();               // 图例立刻转成"本楼无房间用途数据"，不留上一栋的统计
    }
    throw err;
  }
}
buildingSel.addEventListener('change', () => {
  const b = buildings.find((x) => x.name === buildingSel.value);
  if (b) loadBuilding(b).catch((err) => console.error('切换建筑失败：', err));
});

// 清单里没有的单栋（或清单整个拿不到）时用的基线：理化楼的老布局（data/ 根下直接是 floor*.json）。
// 提成常量是为了让 rebuild() 末尾也能拿它给标题收尾 —— 那里只知道楼名，不一定找得到清单对象。
const LEGACY_LIHUA = { name: 'lihua', title: '理化楼（基线）', floors: FLOOR_COUNT, dir: 'data' };

fetch('data/buildings/index.json')
  .then((res) => { if (!res.ok) throw new Error(`index.json ${res.status}`); return res.json(); })
  .then((list) => {
    for (const b of list) {
      buildings.push(b);
      const opt = document.createElement('option');
      opt.value = b.name;
      // 编号在前：下拉按编号排序浏览时更好找（c006 比「第六教学楼」好定位）
      opt.textContent = `${b.name} ${b.title}（${b.floors}层）`;
      buildingSel.appendChild(opt);
    }
    // ?building=c054 —— 按名直开某一栋（自动化必须能一栋一页地开，而不是在同一页上连切）
    const want = QS.get('building');
    if (want && !buildings.some((x) => x.name === want)) {
      // ★ 点名了清单里没有的楼 ⇒ **不回退到第一栋**。回退会把不存在的名字变成一次"载入成功"
      //   （实测 ?building=zzz-no-such-building：场景里是理化楼 118 间，geometryBuilding='lihua'，
      //   builtToken 已置位 —— 自动化认它成功）。查无此楼就直说，不画任何几何。
      const el = document.getElementById('bname');
      if (el) el.textContent = `${want} · 清单里没有这栋楼`;
      console.warn('?building=%s 不在清单里（清单 %d 栋）', want, buildings.length);
      return;
    }
    const def = (want && buildings.find((x) => x.name === want)) || buildings[0];
    if (!def) throw new Error('建筑清单为空');
    buildingSel.value = def.name;
    // 单栋载入失败**就地**收口（loadBuilding 里已清场景、已改标题），不让它升到下面那个 catch：
    // 那个 catch 的职责是"清单本身拿不到 → 回退基线 data/"，把单栋失败也交给他，就等于
    // 「某栋挂了就改画理化楼」—— 这正是上面那条注释在防的事。
    return loadBuilding(def).catch((err) => console.error('载入失败（场景已清空，不盖就绪章）：', err));
  })
  .catch((err) => {
    // 只兜「清单本身拿不到」（网络断了 / index.json 404）。此时下拉是空的、楼名无从谈起，
    // 回退到 data/ 根下的理化楼基线是唯一能显示东西的选择。点名了 ?building= 就不回退：
    // 用户要的是那一栋，给他另一栋比给空白更糟。
    if (QS.get('building')) {
      console.error('建筑清单加载失败，且点名了 ?building= —— 不做静默回退：', err);
      return;
    }
    // ?su=1 时同理**不回退**：回退会把默认那条路（本页现实现的几何）端出来冒充 SU 的数据 ——
    // 而这条路存在的全部意义就是"看 SU 的数据"。清单拿不到就没有 SU 规格可画，直说。
    if (suMode) {
      const el = document.getElementById('bname');
      if (el) el.textContent = '建筑清单加载失败，且 ?su=1 —— 不回退到另一条渲染路径';
      console.error('建筑清单加载失败（?su=1，不回退）：', err);
      return;
    }
    console.error('加载建筑清单失败，回退基线 data/', err);
    loadSpec('data')
      .then(() => { applyStyle(); LAYER_HEIGHT = S.floor_h || 4.2; return loadFloors('data', FLOOR_COUNT); })
      .then((floors) => {
        loadedFloors = floors;
        currentBuilding = LEGACY_LIHUA.name;
        syncPanel();
        buildFloorButtons(FLOOR_COUNT);
        rebuild();                  // 标题收尾会走到 LEGACY_LIHUA（清单为空 ⇒ buildings.find 找不到 lihua）
      })
      .catch((e2) => console.error('加载楼层几何失败：', e2));
  });

// ---------- 路径规划：读 /api/path 的 3D 折线，画成管状路径 ----------
const pathGroup = new THREE.Group();
scene.add(pathGroup);
const WALK_H = 0.35;   // 路径悬浮高度（楼板顶上方，避开房间色块）
const PATH_R = 0.09;   // 路径管半径
const pathMat = new THREE.MeshStandardMaterial({ color: 0x2ee6a0, roughness: 0.35, emissive: 0x2ee6a0, emissiveIntensity: 0.5 });
const pathStartMat = new THREE.MeshStandardMaterial({ color: 0x2ee6a0, roughness: 0.3, emissive: 0x2ee6a0, emissiveIntensity: 0.9 });
const pathEndMat = new THREE.MeshStandardMaterial({ color: 0x4d9fff, roughness: 0.3, emissive: 0x4d9fff, emissiveIntensity: 0.9 });

const pathFrom = document.getElementById('pathFrom');
const pathTo = document.getElementById('pathTo');
const pathGo = document.getElementById('pathGo');
const pathClear = document.getElementById('pathClear');
const pathInfo = document.getElementById('pathInfo');

// floor JSON (x, y) + 楼层高 z → THREE 世界 (x, z+WALK_H, -y)
function toWorld3(p) { return new THREE.Vector3(p[0], p[2] + WALK_H, -p[1]); }

function segCylinder(a, b, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-4) return null;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(PATH_R, PATH_R, len, 8), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function clearPath() {
  while (pathGroup.children.length) {
    const c = pathGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
  }
}

function drawPath(pts) {
  clearPath();
  for (let i = 0; i < pts.length - 1; i++) {
    const m = segCylinder(toWorld3(pts[i]), toWorld3(pts[i + 1]), pathMat);
    if (m) pathGroup.add(m);
  }
  const a = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), pathStartMat);
  a.position.copy(toWorld3(pts[0]));
  pathGroup.add(a);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), pathEndMat);
  b.position.copy(toWorld3(pts[pts.length - 1]));
  pathGroup.add(b);
}

function buildRoomSelects(rooms) {
  const sorted = rooms.slice().sort((a, b) => (a.floor - b.floor) || String(a.number).localeCompare(String(b.number)));
  const byFloor = {};
  for (const r of sorted) (byFloor[r.floor] = byFloor[r.floor] || []).push(r);
  const fill = (sel) => {
    sel.innerHTML = '';
    for (const f of Object.keys(byFloor).sort((a, b) => a - b)) {
      const og = document.createElement('optgroup');
      og.label = `${Number(f) + 1}层`;
      for (const r of byFloor[f]) {
        const o = document.createElement('option');
        // ★ value 用**房间 id**，不用房号：id 实测**全局唯一（0 撞号）**，而房号在部分楼**不唯一**
        //   （如 '卫' 跨 c046/c080 共 171 行）。服务端注释也是这个口径（`_scratch/_retired_20260925/serve_rooms.py:208`：
        //   「房间 id 唯一 → 前端走 from_id/to_id」）—— 原先前端发的是房号，没照做。
        //   data-number 只给人和回归脚本看，不参与请求。
        o.value = r.id;
        o.dataset.number = r.number;
        o.textContent = `${r.number}${r.purpose ? ' · ' + r.purpose : ''}`;
        og.appendChild(o);
      }
      sel.appendChild(og);
    }
  };
  fill(pathFrom); fill(pathTo);
}

pathGo.addEventListener('click', async () => {
  const from = pathFrom.value, to = pathTo.value;
  if (!from || !to) { pathInfo.textContent = '请先选择起终点'; return; }
  if (from === to) { pathInfo.textContent = '起终点相同'; clearPath(); return; }
  // 场景里没有"已载入的楼"时**不发请求**：`geometryBuilding` 为空意味着几何与任何一栋都不对应
  // （切楼过渡期，或载入失败态）。这时发出去的 building 只能瞎猜，服务端 `building=None` 又恰好
  // 是"按理化楼算"—— 猜错就等于把理化楼的路径画到别的楼上，正是这一刀要堵的静默错答案。
  if (!geometryBuilding) { pathInfo.textContent = '当前没有已载入的楼，无法规划'; clearPath(); return; }
  pathInfo.textContent = '计算中…';
  try {
    // ★ 发的是**房间 id + 当前楼**，不是房号（`from`/`to` 那两个参数是给 CLI 和旧链接的）。
    //   原先只发房号且不带 building ⇒ 服务端只按理化楼找：其余 47 栋选自己的房号必得
    //   `未找到房间 …`，选 lihua 房号则把**理化楼的路径画在这栋楼的几何上**（静默给错答案）。
    //   实测 `from_id=8&to_id=2` 带不带 building 结果一模一样（10.82 m）—— 它真的会静默回落。
    const bld = geometryBuilding;
    const res = await fetch(`${API_BASE}/api/path?from_id=${encodeURIComponent(from)}&to_id=${encodeURIComponent(to)}`
      + `&building=${encodeURIComponent(bld)}`);
    const j = await res.json();
    // ★ `error` 的两种形状都要认：8140 搬过来之后是**对象**（{code,message}，全站统一信封），
    //   而老 8123 回的是**字符串**。直接拼会把对象渲染成 "[object Object]" ——
    //   屏幕上看着像"报了个错"，却一个字都读不懂，比不报还坏。
    if (!j.success) {
      const em = (j.error && (j.error.message || j.error)) || '未知错误';
      pathInfo.textContent = '规划失败：' + em; clearPath(); return;
    }
    drawPath(j.data.path);
    const f0 = j.data.src.floor, f1 = j.data.dst.floor;
    pathInfo.textContent = `${j.data.length_m} m · ${j.data.path.length} 折点` + (f0 === f1 ? '' : `\n${f0 + 1}层 → ${f1 + 1}层`);
  } catch (e) {
    pathInfo.textContent = '请求失败：' + e.message;
  }
});

pathClear.addEventListener('click', () => { clearPath(); pathInfo.textContent = ''; });

// 房间数据的两个消费者：`roomMap`（点房间看信息）与「路径规划」起终点下拉，都按**当前楼**填。
// ★ 只在楼**真的换了**时才重填：rebuild 会被"改窗参数/切窗户/改层高"反复触发，无条件重填会把
//   用户已经选好的起讫点冲掉。失败则把记号清掉，下次 rebuild 还能再试一次。
let roomsLoadedFor = null;
// 楼没载入 / 载入失败时把房间数据一并收掉（配 `loadBuilding` 的失败分支）：
// 下拉空了、`roomMap` 空了、面板直说 —— 不留"能点但点在别栋上"的余地。
function unloadRooms(reason) {
  roomsLoadedFor = null;
  for (const k of Object.keys(roomMap)) delete roomMap[k];
  buildRoomSelects([]);
  pathInfo.textContent = reason;
}
function loadRoomsFor(building) {
  if (roomsLoadedFor === building) return;
  roomsLoadedFor = building;
  roomsOf(building).then((res) => {
    // ★ 期间切了楼（或那一栋载入失败、被 unloadRooms 收掉）⇒ 这批房间已经过期，直接丢弃。
    //   不加这一条：切楼中途返回的旧响应会把**上一栋**的房间填进这一栋的下拉。
    //   与 `loadBuilding` 里 `my !== buildToken` 是同一个套路。
    if (roomsLoadedFor !== building) return;
    const rooms = res.data || [];
    for (const k of Object.keys(roomMap)) delete roomMap[k];   // 清上一栋，别跨楼串数据
    for (const r of rooms) roomMap[r.id] = r;
    buildRoomSelects(rooms);
    if (!rooms.length) pathInfo.textContent = '本楼没有房间数据，路径规划不可用';
  }).catch((err) => {
    // ★ 这句与上面那句「本楼没有房间数据」**必须字面不同**：一个是「读不到」，一个是「真的没有」。
    //   带上服务端原话（`roomsOf` 已把它收成首行，如「连不上房间库：ConnectionTimeout…」），
    //   屏幕上才分得清 —— 只说「加载失败」，用户还是不知道该去修 PG 还是该换一栋楼。
    roomsLoadedFor = null;
    pathInfo.textContent = '房间列表加载失败，路径规划不可用：'
      + (err && err.message ? err.message : String(err));
    console.error('加载房间列表失败（building=%s）：', building, err);
  });
}

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  if (labelsOn) updateLabels(false);      // 相机静止时函数内部会直接返回（不碰 DOM）
})();

// 调试钩子：供无头浏览器/自动化「自己看」检查场景状态，不影响正常交互。
// ★ purposeColorOf / purposeFamilyOf 是**问答口**：归族与配色的规则只有本页这一处实现，
//   Python 侧（_scratch/_purpose_color_guard.py、_purpose_layer_regression.py）只负责"问它、再验它"，
//   不存在"两边各抄一版、然后一起错"。
window.__gym3d = { scene, camera, renderer, controls, wallMeshes, THREE, get info() { return renderer.info; },
  purposeColorOf: (p) => roomColor(p),                 // 字符串 '#rrggbb'（与 userData.color 同形，大小写一致）
  purposeFamilyOf: (p) => purposeFamilyOf(p),
  familyAnchors: () => Object.assign({}, FAMILY_ANCHOR),
  legacyColorOf: (p) => '#' + legacyRoomColor(p).toString(16).padStart(6, '0'),
  labelCount: () => (labelsOn ? labelShown : 0),
  legendPurposes: () => legendPurposes,                // 图例代表多少种用途（不是行数：长尾会折叠）
  visibleRoomCount: () => visibleRooms().length,       // 当前可见楼层里有多少间（图例口径的唯一依据）
  get buildToken() { return buildToken; },
  get builtToken() { return builtToken; },
  get geometryBuilding() { return geometryBuilding; },
  // ---- ?su=1 分支的自查口（判据一律**从场景里数**，不读"我打算画什么"——量意图会得到假绿）----
  get suMode() { return suMode; },
  suStats: () => {
    const byGroup = {}; let meshes = 0, rooms = 0;
    for (const m of pickables) {
      const u = m.userData || {};
      if (!u.su) continue;
      meshes++;
      byGroup[u.group] = (byGroup[u.group] || 0) + 1;
      if (u.type === '房间') rooms++;
    }
    return { mode: suMode, meshes, rooms, parts: meshes - rooms, byGroup,
             sha16: suSha, bytes: suBytes,
             specParts: suSpec ? (suSpec.parts || []).length : 0,
             specGroups: suSpec ? ((suSpec.meta || {}).groups || null) : null,
             specUrl: suSpec ? `data/su/${geometryBuilding}.json` : null,
             floors: FLOOR_COUNT, layerH: LAYER_HEIGHT };
  },
  // 跨源对账口：逐间给出**SU 带过来的用途色**（cap）与本页**自己算的用途配色**（roomColor），
  // 两者相等才说明"地垫与 SU 里同色"这句话成立（不相等应当报红，不是静默取一个）。
  suPadColors: () => roomMeshes.filter((m) => m.userData.su).map((m) => ({
    number: m.userData.number, floor: m.userData.floor, purpose: m.userData.purpose,
    suColor: m.userData.suColor, pageColor: m.userData.color, area: m.userData.area })) };
</script>
</body>
</html>
