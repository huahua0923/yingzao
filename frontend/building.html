<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学楼 · 整栋立体模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15151f; }
  #bar { position: fixed; left: 14px; top: 12px; z-index: 6; display: flex; align-items: center; gap: 8px; }
  #bar label { color: #9aa0b5; font: 13px "Microsoft YaHei", sans-serif; }
  #bar select { padding: 5px 8px; background: #20242f; color: #dfe3f0; border: 1px solid #3a4154;
                border-radius: 5px; font: 13px "Microsoft YaHei", sans-serif; max-width: 260px; }
  #bar select:focus { outline: none; border-color: #33ff99; }
  #bar #bname { color: #8fe0a8; font: 600 14px "Microsoft YaHei", sans-serif; margin-left: 6px;
                text-shadow: 0 0 6px rgba(0,0,0,.6); white-space: nowrap; }
  /* 生成时间。**推算值必须看起来就不一样** —— 它是从产物 mtime 反推的，不是生成时刻。
     同字号压暗 + 虚线底边，而不是只换个词，免得"（推算）"两个字被一眼略过去。 */
  #bar #bname .gen { font-weight: 400; font-size: 12.5px; color: #7d8a99; cursor: help; }
  #bar #bname .gen-approx { color: #8a7f63; border-bottom: 1px dashed #8a7f63; }
  #hint { position: fixed; left: 14px; top: 44px; color: #9aa0b5; font: 13px/1.7 "Microsoft YaHei", sans-serif;
          pointer-events: none; user-select: none; }
  #hint b { color: #dfe3f0; }
  #floors { position: fixed; left: 14px; top: 118px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
  #floors button { padding: 6px 12px; background: #20242f; color: #9aa0b5; border: 1px solid #3a4154;
                   border-radius: 5px; font: 13px "Microsoft YaHei", sans-serif; cursor: pointer; }
  #floors button:hover { color: #dfe3f0; border-color: #5a6478; }
  #floors button.active { background: #2a4a3a; color: #33ff99; border-color: #33ff99; }
  #tag { display: none; position: fixed; z-index: 10; padding: 3px 9px; background: #20242f;
         color: #dfe3f0; border: 1px solid #3a4154; border-radius: 4px;
         font: 12px/1.5 "Microsoft YaHei", sans-serif; pointer-events: none; white-space: nowrap; }
  #info { display: none; position: fixed; right: 14px; top: 12px; z-index: 10; padding: 10px 14px;
          background: rgba(20, 23, 32, .92); color: #c8cddb; border: 1px solid #3a4154;
          border-radius: 6px; font: 13px/1.9 "Microsoft YaHei", sans-serif; max-width: 280px; }
  #info .t { color: #33ff99; font-weight: 700; font-size: 14px; }
  #info b { color: #8f96a8; font-weight: 400; margin-right: 4px; }
  #info .tip { color: #6f7690; font-size: 11px; margin-top: 4px; }
  #panel { position: fixed; right: 14px; bottom: 14px; z-index: 20; width: 224px;
           background: rgba(20, 23, 32, .94); color: #c8cddb; border: 1px solid #3a4154;
           border-radius: 8px; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
  #panel summary { cursor: pointer; padding: 8px 12px; color: #dfe3f0; font-weight: 600; user-select: none; }
  #panel .body { padding: 0 12px 12px; }
  #panel label { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  #panel label span { color: #9aa0b5; }
  #panel input, #panel select { width: 84px; padding: 3px 6px; background: #20242f; color: #dfe3f0;
                                border: 1px solid #3a4154; border-radius: 4px; font: 12px "Microsoft YaHei", sans-serif; }
  #panel button { width: 100%; margin-top: 8px; padding: 6px; background: #2a4a3a; color: #33ff99;
                  border: 1px solid #33ff99; border-radius: 5px; cursor: pointer; font: 13px "Microsoft YaHei", sans-serif; }
  #panel button:hover { background: #33604a; }
  #panel #pathFrom, #panel #pathTo { width: 118px; }
  #panel #pathClear { background: #3a2b2b; color: #ff9d9d; border-color: #7a3a3a; }
  #panel #pathClear:hover { background: #4a3636; }
  #panel #pathInfo { margin-top: 8px; color: #9aa0b5; font-size: 12px; line-height: 1.6; white-space: pre-line; }
  /* ---------- 用途图层：中文标注层 + 图例 ----------
     ★ #labelLayer 必须 pointer-events:none：它盖满整个视口，会挡住 canvas 的拾取
       （回归脚本用 elementFromPoint(中心) 断言命中的是 CANVAS，这条不能破）。
     z-index 4 低于工具条(5)/标签(10)/图例(10)/面板(20) —— 浮签永远压不住控件。 */
  #labelLayer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  #labelLayer .rl { position: absolute; left: 0; top: 0; padding: 0 5px; white-space: nowrap;
                    border-radius: 3px; font: 12px/1.55 "Microsoft YaHei", sans-serif; color: #10131a;
                    background: rgba(255,255,255,.82); border: 1px solid rgba(0,0,0,.28);
                    box-shadow: 0 1px 3px rgba(0,0,0,.5);
                    /* 位移一律走 transform（不动 left/top：每帧改那两只属性会触发布局） */
                    will-change: transform; transform: translate3d(-9999px,-9999px,0); }
  #labelLayer .rl .n { font-weight: 700; }
  #legend { display: none; position: fixed; right: 252px; bottom: 14px; z-index: 10; width: 190px;
            max-height: 60vh; overflow: auto; padding: 8px 10px; background: rgba(20,23,32,.92);
            border: 1px solid #3a4154; border-radius: 8px; color: #c8cddb;
            font: 12px/1.7 "Microsoft YaHei", sans-serif; }
  #legend .h { color: #dfe3f0; font-weight: 600; margin-bottom: 4px; }
  #legend .sub { color: #6f7690; font-size: 11px; margin-bottom: 4px; }
  #legend .row { display: flex; align-items: center; gap: 6px; padding: 1px 2px; border-radius: 3px; cursor: pointer; }
  #legend .row:hover { background: #2a3040; }
  #legend .row.dim { opacity: .38; }
  #legend .sw { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.45); }
  #legend .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #legend .ct { flex: 0 0 auto; color: #8f96a8; }
  #legend .na, #legend .tail { color: #6f7690; }   /* na=无数据提示；tail=长尾折叠行。两件事，别共用一个类名 */
  #legend .sub.note { color: #d8b96a; line-height: 1.35; }   /* 自动切层的说明（一次性，动一下楼层就没有） */
</style>
</head>
<body>
<div id="bar">
  <label>建筑</label>
  <select id="buildingSel"></select>
  <span id="bname"></span>
</div>
<div id="hint">
  <b>拖拽</b>旋转 &nbsp; <b>滚轮</b>缩放 &nbsp; <b>右键拖拽</b>平移<br>
  <b>悬停</b>看构件名 &nbsp; <b>点击房间地面</b>看数据库信息（编号/面积/用途/单位）<br>
  标准墙厚(外 0.30/内 0.24) · 外立面开窗 · 门 2.1m 高
</div>
<div id="floors">
  <button data-f="all" class="active">全部</button>
  <span id="floorBtns"></span>
  <button id="wallToggle" class="active">墙体 ✓</button>
  <button id="wallTransparentToggle">墙体透明 ✗</button>
  <button id="winToggle">窗户 ✗</button>
  <button id="purposeToggle" class="active">用途配色 ✓</button>
  <button id="labelToggle">标注 ✗</button>
  <button id="legendToggle" class="active">图例 ✓</button>
  <button id="srcToggle" title="交付楼层 = 本页从 data/floors/*.json 现算的这座楼；SU 规格 = SketchUp 里那座楼真实存在的那几件（data/su/&lt;楼&gt;.json）">数据源：交付楼层</button>
</div>
<div id="labelLayer"></div>
<div id="legend"></div>
<div id="tag"></div>
<div id="info"></div>
<div id="panel">
  <details open>
    <summary>构件参数</summary>
    <div class="body">
      <label><span>窗宽 (m)</span><input id="p_win_w" type="number" step="0.1" min="0.4" value="2.0"></label>
      <label><span>窗高 (m)</span><input id="p_win_h" type="number" step="0.1" min="0.4" value="1.5"></label>
      <label><span>窗台高 (m)</span><input id="p_win_sill" type="number" step="0.1" min="0" value="0.9"></label>
      <label><span>窗间距 (m)</span><input id="p_win_spacing" type="number" step="0.5" min="2" value="6.5"></label>
      <button id="p_apply">重新生成</button>
    </div>
  </details>
  <details open>
    <summary>路径规划</summary>
    <div class="body">
      <label><span>起点</span><select id="pathFrom"></select></label>
      <label><span>终点</span><select id="pathTo"></select></label>
      <button id="pathGo">规划路径</button>
      <button id="pathClear">清除路径</button>
      <div id="pathInfo"></div>
    </div>
  </details>
  <details>
    <summary>标注与图例</summary>
    <div class="body">
      <label><span>标注最小面积 (m²)</span><input id="p_label_min" type="number" step="1" min="0" value="12"></label>
      <label><span>单层最多标注</span><input id="p_label_max" type="number" step="5" min="5" value="60"></label>
      <button id="p_label_apply">应用</button>
      <div style="color:#6f7690;font-size:11px;line-height:1.5;margin-top:6px">
        标注默认关，点工具条「标注」才显示。<br>
        开着标注时会自动落到某一层（整栋视距下会叠成一团墨）。图例的间数随当前楼层变 —— 数字就是你眼前看到的这些东西。
      </div>
    </div>
  </details>
</div>
<!--
  ★ three 走**仓内** `frontend/site/vendor/three/`，不再走 unpkg CDN。
    本仓记过这笔账（`frontend/site/building.html:8-9`）：「查看器硬依赖 CDN」，
    而它是**断网/内网直接白屏**。这个页面现在挂在管理进程（8140）的根上，
    与 `/site/` 同一个进程，所以那份 vendor 直接可用，不必各自一份。

  ★ 路径是**根绝对**（`/site/vendor/...`）而不是相对（`./vendor/...`）：
    本页挂在**根级** `/building.html`，相对路径会解析成 `/vendor/...` —— 那里没有东西。
    先例 `frontend/site/building.html` 用的是相对，因为那个页面就服务在 `/site/` 下。

  ★ 用 `.min` 那一对，两个文件**成对**搬：`three.module.min.js` 内部
    `from"./three.core.min.js"` —— 少一个就是「模块能解析、一 import 就 404」。
    vendor 里 `build/` 下恰好只有这两个 `.min`，与非压缩版不是同一份。

  ★ 这是一次**跨版本升级**：`0.160.0 → 0.185.1`（与 `node_modules`、与前台同一份）。
    升级不是"顺手"：旧版已不再从 CDN 取得到同一个行为，而两处各用一版迟早分叉。
    ★ **升级后画面确实变了，已量过并接受**（改前/改后同视角截图在
      `_scratch/_p3_before_lihua.png` / `_p3_after_lihua.png`，比对工具
      `_scratch/_p3_visual_diff.py`）：
      · 不变的：HUD 文字**逐字符相同**（5694 字，同一栋同一层同样 118 间）、
        非背景像素面积差 **0.24%**（相机与几何没动，差的是边缘抗锯齿）；
      · 变了的：差异像素 16.26%、平均色差 13.09/765 —— 观感是**更亮、更平**，
        每层之间那道阴影分界线明显变淡。
      · 根因在 `RoomEnvironment.js` 自己身上（r160→r185 的两处改动，方向一致）：
        ① 主灯 `PointLight` 旧版写 `if (renderer !== null && renderer._useLegacyLights
           === false) intensity = 900`，而本页调的是 `new RoomEnvironment()` —— **没传
           renderer** ⇒ 落到 legacy 那档 **5**；新版写死 **900**。
        ② 面光的材质由 `MeshBasicMaterial` + `color.setScalar(i)` 换成
           `MeshLambertMaterial({color:0, emissive:白, emissiveIntensity:i})`（源码注 `#31348`）。
      · **为什么不把旧观感"修回去"**：那个偏暗的样子来自上一条那个**少传的 renderer**
        （RoomEnvironment 的形参就是给这个用的，旧版查到 renderer 为 null 就退回 legacy 值），
        属于**偶然落进的代码分支**，不是有人设计过的配色。追着它补一个系数，就是
        对着 three 的内部实现写死一个魔法数 —— 下次升级还会坏，而坏法不会报错。
      · 于是这里留的是**一次显式的接受**（数字 + 两张图 + 根因），不是"没注意到"。

  ★ importmap 必须在**任何** module 脚本之前：浏览器解析第一个 module 前就定下表了。
-->
<script type="importmap">
{
  "imports": {
    "three": "/site/vendor/three/build/three.module.min.js",
    "three/addons/": "/site/vendor/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// 标准参数（fetch data/spec.json；失败回退内置常量，两条渲染路径同源）
const DEFAULT_SPEC = {
  floor_h: 4.2, slab_t: 0.2, wall_h: 4.0,
  outer_wall_t: 0.30, inner_wall_t: 0.24,
  door_h: 2.4, door_panel_t: 0.05,
  column_w: 0.5, column_d: 0.5,
  win_sill: 0.9, win_h: 1.5, win_w: 2.0, win_spacing: 6.5,
  win_in_depth: 0.40, win_out: 0.06, glass_t: 0.04, win_frame_t: 0.06,
  win_margin: 1.5, win_min_seg: 3.5, win_min_run: 2.0,
  roof_t: 0.2, parapet_h: 0.9, parapet_t: 0.5,
  stair_landing: 0.15,
};
let S = DEFAULT_SPEC;

let FLOOR_COUNT = 5;          // 由当前建筑的楼层数覆盖
let LAYER_HEIGHT = 4.2;       // 层高(m)，由 spec.floor_h 覆盖

// ---------- 降级开关（出问题能立刻回到旧观感，不用改代码） ----------
//   ?purpose=0   逐位复现改动前的三分支配色 ★ 这就是回归的 A/B 杠杆（不是调试残留，别删）
//   ?labels=1    打开标注（默认关：用户定的"点一下才显示"）
//   ?legend=0    关图例；?label_min=25 改标注最小面积；?building=c054 按名直开某一栋
//   ?su=1        改画 SU 规格（data/su/<楼>.json，即 SU 建体吃的那份）；没有这份规格的楼会**明说**载入失败，不回退
// 放在这里而不是靠近使用点：下面 L1181 附近的 ?building= 初始化也要读 QS。
const QS = new URLSearchParams(location.search);
const qsFlag = (k, dflt) => {
  const v = QS.get(k);
  return v == null ? dflt : !(v === '0' || v === 'false' || v === 'no');
};
let purposeColorOn = qsFlag('purpose', true);
let labelsOn = qsFlag('labels', false);
let legendOn = qsFlag('legend', true);
let labelMinArea = parseFloat(QS.get('label_min'));
if (!(labelMinArea >= 0)) labelMinArea = 12;
let labelMax = 60;
// ★ geometryBuilding = **几何真的换成了哪一栋**（在 rebuild 里才置），不是"选了哪一栋"。
//   不能用 currentBuilding 当判据：它在 loadBuilding 开头就被改写，切楼过渡期/加载失败态会误杀。
let geometryBuilding = null;
let buildToken = 0;           // 每发起一次切楼 +1
let builtToken = -1;          // 每次 rebuild 落地后 = 当时的 buildToken（两者相等 ⇒ 眼前这栋就是选中的那栋）

// ---------- SU 规格分支（?su=1）----------
// 默认那条路画的是**本页用 JS 重实现**的建模（读 data/floors/*.json + spec.json 现算墙/窗/门）；
// 这条路画的是 SketchUp 里那座楼**真实存在的那 N 件**——规格就是 SU 建体时吃的那一份
// （sha256 与 su_deploy.sh 投递到 SU 的那一份逐位相同，见 data/su/_meta.json），颜色也取自 SU 自己的材质。
// ⇒ 同一栋楼的**两种数据源**，不是两种画法：SU 侧「每层可解开 + 每间用途可见」在这条路上是原生的。
//   ?su=0（默认）走原路，?su=1 走这条路；两条路互斥，默认路径的行为一个字节都不动。
// ★ let 而不是 const：工具条上那个「数据源」按钮要能在两条路之间切（切 = 把这一栋重载一遍）。
//   切的同时会写回地址栏（?su=1 / 去掉它）—— 让眼前这一屏可分享、可复现，也免得有人以为
//   "SU 的数据"只存在于某个手输的 URL 里。
let suMode = qsFlag('su', false);
let builtSource = null;     // 上一次落地的几何来自哪条路（'su' | 'floors'）；切数据源时"同一栋"也得重载
let suSpec = null;          // data/su/<楼>.json 的解析结果（meta + parts）
let suSha = null;           // 规格 sha256 的**前 16 位**；非安全上下文算不出 ⇒ 保持 null，显示 '—'（不许伪造）
let suBytes = 0;            // 规格字节数（照原样报，不换算）
const suWallMats = [];      // SU 的墙材质：颜色逐面烘在顶点上 ⇒ 换不掉材质，只能改这一个材质本身
const suExtraGroups = [];   // 整栋尺度的那组（屋顶/场地）：跟着 roofMeshes 在浏览单层时一起隐藏

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a23);
scene.fog = new THREE.Fog(0x171a23, 260, 760);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1600);
camera.position.set(105, 82, 122);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3a44, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(70, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 500;
const sc = 140;
sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc;
sun.shadow.camera.top = sc; sun.shadow.camera.bottom = -sc;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.03;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8899cc, 0.6);
rim.position.set(-60, 45, -55);
scene.add(rim);

const ROOM_PAD = 0.05;   // 房间色块厚度：贴在楼板顶上方，避免与楼板 z-fighting
const baseMat = new THREE.MeshStandardMaterial({ color: 0xa8c8e8, roughness: 0.9 });   // 地面浅蓝（楼板铺满整层，走廊/墙下也盖住，房间色块只作点击层）
let wallInnerMat = new THREE.MeshStandardMaterial({ color: 0xcfc9bd, roughness: 0.9, metalness: 0.0 });
let wallOuterMat = new THREE.MeshStandardMaterial({ color: 0xa4533d, roughness: 0.85, metalness: 0.0 });
let parapetMat = new THREE.MeshStandardMaterial({ color: 0x5a4a40, roughness: 0.8 });
let roofMat = new THREE.MeshStandardMaterial({ color: 0x434b4a, roughness: 0.85 });
let glassMat = new THREE.MeshStandardMaterial({ color: 0x789cb8, roughness: 0.06, metalness: 0.05, transparent: true, opacity: 0.6, depthWrite: false, emissive: 0x223a4d, emissiveIntensity: 0.6 });
let winFrameMat = new THREE.MeshStandardMaterial({ color: 0xc2c7ce, roughness: 0.45, metalness: 0.35 });   // 铝合金窗框（金属度降 0.35，避免反射蓝色环境把框染深蓝/黑）
let doorMat = new THREE.MeshStandardMaterial({ color: 0x8a5a38, roughness: 0.55, metalness: 0.05 });
const stairMat = new THREE.MeshStandardMaterial({ color: 0xd0c198, roughness: 0.7 });
const columnMat = new THREE.MeshStandardMaterial({ color: 0x9aa2b0, roughness: 0.7, metalness: 0.05 });
const shaftMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.8, metalness: 0.1 });

// ---------- 房间材质：按颜色缓存 ----------
// 现状是**每间房 new 一个材质**（c054 一层 480 间 → 480 个），改后同色共用一个（≤ 该层颜色数）。
// ★ 缓存**不 dispose**：颜色是纯函数，同一个用途在任何楼里同色，切楼/重建后继续复用。

// FNV-1a 32 位 —— 同一用途在任何楼里同色；★ 一律用 `>>>`（`>>` 是算术右移，>2^31 时给负数，抖动会跑偏）

  const f = (v) => Math.max(0, Math.min(255, Math.round((v + m) * 255)));

function makeShape(pts, holes) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  if (holes) for (const h of holes) if (h && h.length >= 3) s.holes.push(makeHolePath(h));
  return s;
}
function makeHolePath(pts) {
  const hp = new THREE.Path();
  hp.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) hp.lineTo(pts[i][0], pts[i][1]);
  hp.closePath();
  return hp;
}
function addExtrude(shape, holes, depth, mat, y0) {
  if (holes) for (const h of holes) shape.holes.push(makeHolePath(h));
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotateX(-Math.PI / 2);          // shape(xy) 挤 z -> xz 平面挤出 y(高)
  mesh.position.y = y0 || 0;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// 实例化盒子：把大量同材质 BoxGeometry 合并成一个 InstancedMesh（1 个 draw call）。
// list: [{sx,sy,sz,x,y,z,data}]；data 存 userData.instances，点击经 instanceId 反查。
function addInstancedBoxes(list, group, mat) {
  if (!list.length) return;
  const geo = new THREE.BoxGeometry(1, 1, 1);   // 单位盒模板，逐实例 scale 出真实尺寸
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const m4 = new THREE.Matrix4();
  list.forEach((b, idx) => {
    m4.makeScale(b.sx, b.sy, b.sz);
    m4.setPosition(b.x, b.y, b.z);
    mesh.setMatrixAt(idx, m4);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = false; mesh.receiveShadow = false;
  mesh.userData = { instances: list.map((b) => b.data) };
  group.add(mesh);
  wallMeshes.push(mesh);
}

// ---------- 前端布窗（与 Python facade_windows 等价，参数可调） ----------
function pointToSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  if (L2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function polyBoundaryDist(px, py, outline) {
  let d = Infinity;
  for (let i = 0; i < outline.length; i++) {
    const a = outline[i], b = outline[(i + 1) % outline.length];
    d = Math.min(d, pointToSegDist(px, py, a[0], a[1], b[0], b[1]));
  }
  return d;
}
function pointInPoly(px, py, poly) {
  // 射线法（奇偶规则）：判断点是否落在多边形（含墙环薄带）内部
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// ---------- 房间标注锚点（平面坐标）----------
// 三级降级，全部复用上面既有的 pointInPoly / polyBoundaryDist：
//   ① 面积质心（鞋带公式）—— L 形/凹形房间的质心会落在房间外；
//   ② 7×7 网格里找「落在多边形内、且离边界最远」的点（49 次采样）；
//   ③ 都不行就退回质心（标签会压墙，但不至于没有）。
// 离线全库实测（8965 间）：8945 间走①、20 间需②、0 间落到③。
function roomAnchor(poly) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < poly.length; i++) {
    const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];
    const cr = x0 * y1 - x1 * y0;
    a += cr; cx += (x0 + x1) * cr; cy += (y0 + y1) * cr;
  }
  let area = Math.abs(a) / 2;
  let mx, my;
  if (area < 1e-9) {                       // 退化多边形（共线/零面积）：退回顶点平均
    mx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
    my = poly.reduce((s, p) => s + p[1], 0) / poly.length;
    return { ax: mx, ay: my, area: 0 };
  }
  a *= 0.5;
  mx = cx / (6 * a); my = cy / (6 * a);
  if (pointInPoly(mx, my, poly)) return { ax: mx, ay: my, area };
  const xs = poly.map((p) => p[0]), ys = poly.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let best = null, bd = -1;
  for (let i = 0; i < 7; i++) {
    for (let j = 0; j < 7; j++) {
      const px = x0 + (x1 - x0) * i / 6, py = y0 + (y1 - y0) * j / 6;
      if (!pointInPoly(px, py, poly)) continue;
      const d = polyBoundaryDist(px, py, poly);
      if (d > bd) { best = [px, py]; bd = d; }
    }
  }
  if (best) return { ax: best[0], ay: best[1], area };
  return { ax: mx, ay: my, area };
}
// 缓存回写：`rebuild()` 会反复跑（切窗户、改窗参都触发），锚点不该跟着重算。
function roomMeta(r) {
  if (!r._meta) r._meta = roomAnchor(r.poly);
  return r._meta;
}

// ---------- 按面配色（对齐 Python build_standard_glb.wall_side_color）----------
// SU 的规矩：材质是贴在**面的一侧**上的。同一张墙，朝外那面刷外墙涂料、朝内那面刷
// 室内漆——「墙」本身没有外墙/内墙之分，只有「这张面朝哪」。所以这里不按 w.type 把
// 整条墙刷一个色，而是把墙几何的三角形按朝向拆成两组，分别挂外墙/室内材质。
// 这两个常量与 Python 侧同源，改一处必须改另一处。
const FACE_PROBE = 0.06;      // 侧面中点沿外法向探多远判内外（m）
const FACE_EDGE_GAP = 0.12;   // 离轮廓边界多近就算外皮（m，≈半个最大墙厚）

// gap 的由来：轮廓是**照图读的**、墙是**配对出来的**，在梳齿凹口处两者对不齐
// （ny27 北侧 6 个凹口实测差 0.03~0.09m）。只用「探针落在轮廓外」这一条，那几面真
// 外皮会整片判成室内色，北立面变成斑驳的米白。「一张面离轮廓边界不到一个墙厚」= 它
// 就是外皮；实测两极是 0.034（外皮）与 0.214（室内面），中间留了一倍余量。
function faceIsOuter(mx, my, nx, ny, outline) {
  if (!outline || outline.length < 3) return true;
  const px = mx + nx * FACE_PROBE, py = my + ny * FACE_PROBE;
  if (!pointInPoly(px, py, outline)) return true;
  return polyBoundaryDist(px, py, outline) <= FACE_EDGE_GAP;
}

// 给一张墙几何分组：0=原材质（上下盖，与 Python「盖色按墙类」一致）、1=外墙、2=室内。
// 几何一个顶点都不动，只加 group——线框、拾取、枚举照旧。材质数组里 index 0 就是调用方
// 传进来的那个材质对象，applyStyle() 改的也是同一批对象，所以配色仍随参数实时变。
// 采样走 matrixWorld：调用方怎么旋转/平移这个 mesh 都不影响判定（世界坐标即平面坐标，
// x=平面x、z=-平面y，与 GLB 一致）。
const _swV = new THREE.Vector3(), _swN = new THREE.Vector3(), _swM = new THREE.Matrix3();
function splitWallFaces(mesh, outline) {
  if (!outline || outline.length < 3) return;
  const geo = mesh.geometry, pos = geo.attributes.position;
  const nor = geo.attributes.normal, idx = geo.index;
  if (!pos || !nor) return;
  const nTri = Math.floor((idx ? idx.count : pos.count) / 3);
  if (!nTri) return;
  mesh.updateMatrixWorld(true);
  _swM.getNormalMatrix(mesh.matrixWorld);
  const kind = new Uint8Array(nTri);
  for (let t = 0; t < nTri; t++) {
    const ia = idx ? idx.getX(t * 3) : t * 3;
    const ib = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
    const ic = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
    _swN.set(nor.getX(ia) + nor.getX(ib) + nor.getX(ic),
             nor.getY(ia) + nor.getY(ib) + nor.getY(ic),
             nor.getZ(ia) + nor.getZ(ib) + nor.getZ(ic)).applyMatrix3(_swM);
    const nl = Math.hypot(_swN.x, _swN.z);
    if (nl < 1e-6) continue;                       // 上下盖：留原材质
    let mx = 0, mz = 0;
    for (const i of [ia, ib, ic]) {
      _swV.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(mesh.matrixWorld);
      mx += _swV.x; mz += _swV.z;
    }
    kind[t] = faceIsOuter(mx / 3, -mz / 3, _swN.x / nl, -_swN.z / nl, outline) ? 1 : 2;
  }
  const base = mesh.material;
  mesh.material = [base, wallOuterMat, wallInnerMat];
  geo.clearGroups();
  let t0 = 0, cur = kind[0];
  for (let t = 1; t <= nTri; t++) {
    if (t === nTri || kind[t] !== cur) { geo.addGroup(t0 * 3, (t - t0) * 3, cur); t0 = t; cur = kind[t]; }
  }
}
function facadeWindows(floor, spec) {
  // 沿外墙实心段长边等距布窗（合成数据，DXF 无窗），与 Python facade_windows 等价
  const windows = [];
  const outline = floor.outline;
  for (const w of floor.walls) {
    if (w.type !== 'outer') continue;
    const poly = w.poly;
    for (let i = 0; i < poly.length; i++) {
      const ax = poly[i][0], ay = poly[i][1];
      const bx = poly[(i + 1) % poly.length][0], by = poly[(i + 1) % poly.length][1];
      const L = Math.hypot(bx - ax, by - ay);
      if (L < spec.win_min_seg) continue;
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      if (polyBoundaryDist(mx, my, outline) >= spec.outer_wall_t * 0.5) continue;  // 只留外皮面：内皮面距外轮廓=墙厚0.24，半厚0.12剔除，否则内皮也布窗（窗翻倍）
      const dx = (bx - ax) / L, dy = (by - ay) / L;
      let nx = dy, ny = -dx;  // 沿墙方向旋 90° 得法线
      // 内法线探测：不能靠质心（凹墙如南凹口侧墙，质心在凹口侧=朝外，会把法线翻反）。
      // 直接从外皮中点往法线方向探 0.02，落在墙环内的那侧才是"往墙里"的内法线。
      if (!pointInPoly(mx + nx * 0.02, my + ny * 0.02, poly)) { nx = -nx; ny = -ny; }
      const run = L - 2 * spec.win_margin;
      if (run < spec.win_min_run) continue;
      const nwin = Math.floor(run / spec.win_spacing) + 1;
      const step = run / nwin;
      for (let k = 0; k < nwin; k++) {
        const s = spec.win_margin + step * k + step / 2;
        const cx = ax + dx * s, cy = ay + dy * s;
        windows.push({
          wallId: w.id,
          x: +cx.toFixed(3), y: +cy.toFixed(3),
          w: spec.win_w, h: spec.win_h, sill: spec.win_sill,
          horiz: Math.abs(dx) >= Math.abs(dy),
          dx: +dx.toFixed(3), dy: +dy.toFixed(3),
          nx: +nx.toFixed(3), ny: +ny.toFixed(3),
        });
      }
    }
  }
  return windows;
}

const shellGroup = new THREE.Group();
scene.add(shellGroup);
const shellFloorGroups = [];
const floorGroups = [];
const wallMeshes = [];
const roofMeshes = [];   // 屋面板/女儿墙：浏览单层时隐藏，看进楼内（?su=1 时屋顶/场地那组也收到这里）
const roomMeshes = [];   // 房间地垫：标注取锚点、图例统计、切配色都从这里找（几何本身不合并，见下）

async function loadSpec(dir) {
  try {
    const res = await fetch(`${dir}/spec.json`);
    if (res.ok) S = Object.assign({}, DEFAULT_SPEC, await res.json());
  } catch (e) { console.warn('加载 spec.json 失败，回退内置常量', e); }
}
async function loadFloors(dir, count) {
  const floors = [];
  for (let F = 0; F < count; F++) {
    const res = await fetch(`${dir}/floors/floor${F}.json`);
    if (!res.ok) throw new Error(`${dir}/floors/floor${F}.json ${res.status}`);
    floors.push(await res.json());
  }
  return floors;
}

function makeFlight(xCenter, width, yStart, yEnd, zBase, rise, N, mat, parent, F, idx) {
  const tread = (yEnd - yStart) / N;
  for (let i = 0; i < N; i++) {
    const yC = yStart + (i + 0.5) * tread;
    const geo = new THREE.BoxGeometry(width, rise, tread);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(xCenter, zBase + i * rise + rise / 2, -yC);
    m.castShadow = true; m.receiveShadow = true;
    m.userData = { type: '楼梯', label: `${F + 1}层楼梯 #${idx + 1}`, color: '#d0c198', floor: F };
    parent.add(m);
  }
}

// 窗洞不再用「单个带洞 extrude」：窗洞横跨墙厚、恰好贴在 band（墙环）的里外两条边界上，THREE 的
// ExtrudeGeometry（ShapeUtils.triangulateShape → earcut）会把「贴边界的洞」当退化丢掉（墙皮实心、玻璃被埋），
// 内缩 eps 又会留 2mm 不透明墙皮盖住整扇窗（从外看仍是实墙）。故窗带改为拆成「墙段盒子」、窗位留真缺口，
// 见 renderWindowBandSegments —— 等价 SU 的「画窗轮廓 → 推穿成洞」。
// 玻璃：半透明薄板，居中于墙厚（略内嵌于窗框），四周比窗洞内缩一框料厚（win_frame_t）。
function addGlass(win, y0, parent, F) {
  const ft = S.win_frame_t;
  const geo = new THREE.BoxGeometry(win.w - 2 * ft, win.h - 2 * ft, S.glass_t);
  const m = new THREE.Mesh(geo, glassMat);
  m.rotation.y = Math.atan2(win.dy, win.dx);
  const recess = S.outer_wall_t / 2;   // 玻璃坐进窗框中央（墙厚中线）
  m.position.set(win.x + win.nx * recess, y0 + S.win_sill + win.h / 2, -win.y - win.ny * recess);
  m.userData = { type: '窗', label: `${F + 1}层窗`, color: '#789cb8', floor: F };
  wallMeshes.push(m);
  parent.add(m);
}

// 窗框（SU 铝合金框）：四根框料围住窗洞，跨满墙厚、外皮齐平；玻璃内嵌
function addWindowFrame(win, y0, parent, F) {
  const ft = S.win_frame_t;
  const wallT = S.outer_wall_t;
  const half = win.w / 2;
  const sillTop = y0 + S.win_sill;
  const winTop = sillTop + S.win_h;
  const recess = wallT / 2;              // 框中心在墙厚中线，外皮齐平（窗洞已整墙厚打通，框外皮与墙外皮共面不重叠）
  const rotY = Math.atan2(win.nx, -win.ny);   // 厚度轴(Z)对齐内法线（凹墙内法线被翻转，atan2(dy,dx)会把框厚度朝外）
  const vMid = (sillTop + winTop) / 2;
  // [宽(沿墙), 高(竖直), 沿墙中心偏移, 竖直中心高度]
  const members = [
    [win.w,     ft,      0,              winTop - ft / 2],  // 上框
    [win.w,     ft,      0,              sillTop + ft / 2], // 下框
    [ft,        win.h,   -half + ft / 2, vMid],             // 左框
    [ft,        win.h,   +half - ft / 2, vMid],             // 右框
  ];
  for (const [w, h, alongOff, vC] of members) {
    const geo = new THREE.BoxGeometry(w, h, wallT);
    const m = new THREE.Mesh(geo, winFrameMat);
    m.rotation.y = rotY;
    const cx = win.x + win.dx * alongOff + win.nx * recess;
    const cz = -win.y - win.dy * alongOff - win.ny * recess;
    m.position.set(cx, vC, cz);
    m.castShadow = true; m.receiveShadow = true;
    m.userData = { type: '窗框', label: `${F + 1}层窗框`, color: '#' + winFrameMat.color.getHexString(), floor: F };
    wallMeshes.push(m);
    parent.add(m);
  }
}

// 窗带墙段：把外皮直段拆成一块块「墙段盒子」，窗所在段按窗位切开留真缺口（= SU 推穿成洞）。
function renderWindowBandSegments(w, wins, outline, yBottom, depth, F, parent, label) {
  const wallT = S.outer_wall_t;
  const poly = w.poly;
  const n = poly.length;
  // 1) 外皮边 = 边中点到外轮廓 < 半墙厚；内法线用 pointInPoly 探（凹墙质心会翻反，不能靠质心）
  const edges = [];
  for (let i = 0; i < n; i++) {
    const ax = poly[i][0], ay = poly[i][1];
    const bx = poly[(i + 1) % n][0], by = poly[(i + 1) % n][1];
    const L = Math.hypot(bx - ax, by - ay);
    if (L < 1e-6) continue;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    if (polyBoundaryDist(mx, my, outline) >= wallT * 0.5) continue;  // 非外皮边（内皮面）
    const dx = (bx - ax) / L, dy = (by - ay) / L;
    let nx = dy, ny = -dx;
    if (!pointInPoly(mx + nx * 0.02, my + ny * 0.02, poly)) { nx = -nx; ny = -ny; }
    edges.push({ ax, ay, bx, by, dx, dy, nx, ny, L, wins: [] });
  }
  // 2) 窗归到最近的边
  for (const win of wins) {
    let best = null, bestD = 1e9;
    for (const e of edges) {
      const d = pointToSegDist(win.x, win.y, e.ax, e.ay, e.bx, e.by);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best && bestD < 0.3) best.wins.push(win);
  }
  // 3) 每条外皮边按窗位切成 [start,end] 墙块，每块一个盒子
  for (const e of edges) {
    const cuts = e.wins
      .map(win => ({ t: (win.x - e.ax) * e.dx + (win.y - e.ay) * e.dy, half: win.w / 2 }))
      .sort((p, q) => p.t - q.t);
    const segs = [];
    let cur = 0;
    for (const c of cuts) {
      if (c.t - c.half > cur + 1e-3) segs.push([cur, c.t - c.half]);
      cur = Math.max(cur, c.t + c.half);
    }
    if (e.L - cur > 1e-3) segs.push([cur, e.L]);
    for (const [s0, s1] of segs) {
      const len = s1 - s0;
      if (len < 1e-3) continue;
      const cxm = e.ax + e.dx * ((s0 + s1) / 2);
      const cym = e.ay + e.dy * ((s0 + s1) / 2);
      const geo = new THREE.BoxGeometry(len, depth, wallT);
      const m = new THREE.Mesh(geo, wallOuterMat);
      m.rotation.y = Math.atan2(e.nx, -e.ny);   // 厚度轴(Z)对齐内法线（凹墙内法线被翻转，不能固定 atan2(dy,dx)）
      m.position.set(cxm + e.nx * wallT / 2, yBottom + depth / 2, -(cym + e.ny * wallT / 2));
      splitWallFaces(m, outline);               // 摆位之后再判，按面配色读的是世界坐标
      m.castShadow = false; m.receiveShadow = false;
      m.userData = { type: '外墙', label: `${F + 1}层${label}`, color: '#8b8e98', floor: F };
      wallMeshes.push(m);
      parent.add(m);
    }
  }
}

// 外墙三段：底(无窗) + 窗带(真洞) + 顶(无窗) + 玻璃/窗框
function renderWindowedWall(w, wins, z, F, parent, outline) {
  const y0 = z + S.slab_t;
  const sillTop = y0 + S.win_sill;
  const winTop = sillTop + S.win_h;
  const wallTop = y0 + w.height;
  const base = makeShape(w.poly, w.holes);
  for (const [depth, bY, label] of [
    [sillTop - y0, y0, '外墙下段'],
    [wallTop - winTop, winTop, '外墙上段'],
  ]) {
    const m = addExtrude(base, [], depth, wallOuterMat, bY);
    splitWallFaces(m, outline);                 // 按面配色：朝外那张面才是外墙色
    m.castShadow = false; m.receiveShadow = false;
    m.userData = { type: '外墙', label: `${F + 1}层${label}`, color: '#8b8e98', floor: F };
    wallMeshes.push(m);
    parent.add(m);
  }
  renderWindowBandSegments(w, wins, outline, sillTop, winTop - sillTop, F, parent, '外墙窗带');
  for (const win of wins) { addWindowFrame(win, y0, parent, F); addGlass(win, y0, parent, F); }
}

// 中央主体女儿墙：沿 outline 每边外扩一圈薄墙（含北边）
function renderParapetRing(outline, y0, F, parent, label = '中央女儿墙') {
  const t = S.parapet_t, h = S.parapet_h;
  let cx = 0, cy = 0;
  for (const p of outline) { cx += p[0]; cy += p[1]; }
  cx /= outline.length; cy /= outline.length;
  const n = outline.length;
  for (let i = 0; i < n; i++) {
    const a = outline[i], b = outline[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy);
    if (L < 1e-6) continue;
    let nx = dy / L, ny = -dx / L;                      // 法线
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    if ((mx - cx) * nx + (my - cy) * ny < 0) { nx = -nx; ny = -ny; }   // 朝外
    const geo = new THREE.BoxGeometry(L, h, t);
    const m = new THREE.Mesh(geo, parapetMat);
    m.rotation.y = Math.atan2(dy, dx);
    m.position.set(mx + nx * t / 2, y0 + h / 2, -(my + ny * t / 2));
    splitWallFaces(m, outline);                 // 女儿墙朝外那张面 = 立面延续（与 GLB add_parapet 同口径）
    m.castShadow = true; m.receiveShadow = true;
    m.userData = { type: '女儿墙', label: `${F + 1}层${label}`, color: '#' + parapetMat.color.getHexString(), floor: F };
    roofMeshes.push(m);
    parent.add(m);
  }
}

// 双坡屋顶（苏式坡顶）：沿长轴设脊，两侧坡面下到两檐，两端山墙三角封口
function renderGableRoof(outline, roofY, F, parent) {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of outline) {
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  const w = maxX - minX, d = maxY - minY;
  if (w < 0.5 || d < 0.5) return null;
  const rise = Math.min(w, d) * 0.42;   // 坡高 ≈ 0.42 短跨
  const horiz = w >= d;                 // 长轴 x → 脊沿 x
  const V = (x, y, h) => new THREE.Vector3(x, h, -y);
  const verts = [];
  const tri = (a, b, c) => { verts.push(V(a[0], a[1], a[2]), V(b[0], b[1], b[2]), V(c[0], c[1], c[2])); };
  const cy = (minY + maxY) / 2, cx = (minX + maxX) / 2;
  if (horiz) {
    tri([minX, minY, roofY], [maxX, minY, roofY], [maxX, cy, roofY + rise]);
    tri([minX, minY, roofY], [maxX, cy, roofY + rise], [minX, cy, roofY + rise]);
    tri([minX, cy, roofY + rise], [maxX, cy, roofY + rise], [maxX, maxY, roofY]);
    tri([minX, cy, roofY + rise], [maxX, maxY, roofY], [minX, maxY, roofY]);
    tri([minX, minY, roofY], [minX, cy, roofY + rise], [minX, maxY, roofY]);
    tri([maxX, minY, roofY], [maxX, maxY, roofY], [maxX, cy, roofY + rise]);
  } else {
    tri([minX, minY, roofY], [minX, maxY, roofY], [cx, maxY, roofY + rise]);
    tri([minX, minY, roofY], [cx, maxY, roofY + rise], [cx, minY, roofY + rise]);
    tri([cx, minY, roofY + rise], [cx, maxY, roofY + rise], [maxX, maxY, roofY]);
    tri([cx, minY, roofY + rise], [maxX, maxY, roofY], [maxX, minY, roofY]);
    tri([minX, minY, roofY], [cx, minY, roofY + rise], [maxX, minY, roofY]);
    tri([minX, maxY, roofY], [maxX, maxY, roofY], [cx, maxY, roofY + rise]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts.flatMap((v) => [v.x, v.y, v.z]), 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, roofMat);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = { type: '屋顶', label: '坡屋顶', color: '#' + roofMat.color.getHexString(), floor: F };
  parent.add(m);
  roofMeshes.push(m);
  return m;
}

function renderFloor(g, F) {
  const z = F * LAYER_HEIGHT;
  const isTop = !!g.roof;
  const shell = new THREE.Group();
  const interior = new THREE.Group();
  interior.name = `floor-${F}`;
  // 窗户：前端按当前 spec 动态生成（参数可调，与 Python facade_windows 等价）。
  // 合成窗默认关闭（windowsVisible=false）：外墙渲成整片实墙；打开后才开洞 + 贴玻璃。
  const allWindows = windowsVisible ? facadeWindows(g, S) : [];

  // 楼板：楼梯井 + 电梯井都开洞（竖井贯通）。电梯井每层都开（含首层，井道从首层起竖，
  // 顶层设备间楼板也开洞让井道穿入机房；屋顶板单独渲染为实心，覆盖井顶）。
  const slabHoles = [];
  if (F > 0) {
    for (const s of (g.stairwells || [])) {
      slabHoles.push([[s.x0, s.yBot], [s.x1, s.yBot], [s.x1, s.yTop], [s.x0, s.yTop]]);
    }
  }
  for (const e of (g.elevators || [])) {
    slabHoles.push([[e.x0, e.y0], [e.x1, e.y0], [e.x1, e.y1], [e.x0, e.y1]]);
  }
  const slab = addExtrude(makeShape(g.outline), slabHoles.length ? slabHoles : null, S.slab_t, baseMat, z);
  slab.userData = { type: '楼板', label: `${F + 1}层楼板`, color: '#2a2f3a', floor: F };
  shell.add(slab);

  // 房间色块：0.05m 地垫，按用途分色（与 SU 地垫同色）。
  // ★ 逐间一个 mesh、**不合并**：合并能省 3.7% draw call，却要重写拾取链路（buildInfo 靠 userData.id
  //   反查 DB），不值。R 计数不变量（calls/meshes/tri 与改动前逐位相同）也是靠这条成立的。
  // ★ `ROOM_PAD` 与 `z + S.slab_t` 是既定的防 z-fighting 方案，不许动。
  // ★ castShadow 保持 addExtrude 的默认 true **不动**：关掉地垫投影确实更省，但
  //   `renderer.info.render.calls` 含 shadow pass，一关就和基线逐位对不上了 —— 逐位不变量优先。
  (g.rooms || []).forEach((r) => {
    const hex = roomColor(r.purpose);
    const meta = roomMeta(r);
    const m = addExtrude(makeShape(r.poly), null, ROOM_PAD, roomMaterial(hex), z + S.slab_t);
    m.userData = { type: '房间', id: r.id, number: r.number, floor: F,
                   purpose: r.purpose || '',
                   area: meta.area,
                   ax: meta.ax, ay: meta.ay,          // 标注锚点（平面坐标，世界坐标 = (ax, ·, -ay)）
                   label: `${r.number} ${r.purpose || ''}`.trim(),
                   color: hex };
    roomMeshes.push(m);
    interior.add(m);
  });

  // 墙（唯一墙源，按 type）：外墙开窗三段挤，内墙普通挤，女儿墙贴楼板标高
  g.walls.forEach((w, i) => {
    const wins = allWindows.filter((win) => win.wallId === w.id);
    if (w.type === 'outer' && wins.length) {
      renderWindowedWall(w, wins, z, F, shell, g.outline);
      return;
    }
    let y0, h, mat, type;
    if (w.type === 'parapet') {
      // 翼楼屋面女儿墙：贴本层楼板标高（level=slab）
      y0 = z; h = w.height; mat = parapetMat; type = '女儿墙';
    } else {
      y0 = z + S.slab_t; h = w.height; mat = w.type === 'outer' ? wallOuterMat : wallInnerMat;
      type = w.type === 'outer' ? '外墙' : '内墙';
    }
    const m = addExtrude(makeShape(w.poly, w.holes), null, h, mat, y0);
    // 女儿墙的朝外面也是立面的延续，所以不分墙类，一视同仁按面配色（cap 仍走原材质）
    splitWallFaces(m, g.outline);
    if (w.type !== 'parapet') { m.castShadow = false; m.receiveShadow = false; }
    m.userData = { type, label: `${F + 1}层${type} #${i + 1}`, color: '#a6adb9', thickness: w.thickness, height: w.height, floor: F };
    (w.type === 'parapet' ? roofMeshes : wallMeshes).push(m);
    (w.type === 'outer' || w.type === 'parapet' ? shell : interior).add(m);
  });

  // 门：嵌进墙洞的木色板（高 2.1）；落在电梯井口 0.7m 内的门 = 电梯门（金属色 + 标签）
  const elevs = g.elevators || [];
  const isElevDoor = (d) => elevs.some((e) => {
    const dx = Math.max(e.x0 - d.x, 0, d.x - e.x1);
    const dy = Math.max(e.y0 - d.y, 0, d.y - e.y1);
    return Math.hypot(dx, dy) < 0.7;
  });
  // 门 + 门头过梁：InstancedMesh 一次性画完（158 门 → 1 个 draw call，158 过梁 → ≤2 个）。
  // 单位盒做模板，逐实例写 scale/position；点击经 instanceId 反查 userData.instances 取数据。
  const doorPanels = { door: [], shaft: [] };   // 门扇按材质分桶（电梯门=shaftMat）
  const lintels = { outer: [], inner: [] };     // 过梁按外/内墙材质分桶
  g.doors.forEach((d, i) => {
    const h = d.h || S.door_h, t = S.door_panel_t;
    const isElev = isElevDoor(d);
    const data = {
      type: isElev ? '电梯门' : '门',
      label: isElev ? `${F + 1}层电梯门 #${i + 1}` : `${F + 1}层门 #${i + 1}${d.outer ? '（外墙）' : '（内墙）'}`,
      color: isElev ? '#8b929e' : '#c4965c', floor: F,
      w: d.w, h, horiz: d.horiz, outer: d.outer, isElev,
    };
    const sx = d.horiz ? d.w : t, sz = d.horiz ? t : d.w;   // 横门 w×h×t，竖门 t×h×w
    (isElev ? doorPanels.shaft : doorPanels.door).push({
      sx, sy: h, sz, x: d.x, y: z + S.slab_t + h / 2, z: -d.y, data,
    });
    // 门头过梁：门洞在墙 poly 里挖穿到墙顶，按挖洞盒边界在门顶以上补回墙（门洞只到门高）。
    const w0 = z + S.slab_t, wallTop = w0 + S.wall_h, doorTop = w0 + h;
    if (doorTop < wallTop && d.bx0 != null) {
      const lw = d.bx1 - d.bx0, ld = d.by1 - d.by0, lh = wallTop - doorTop;
      (d.outer ? lintels.outer : lintels.inner).push({
        sx: lw, sy: lh, sz: ld,
        x: (d.bx0 + d.bx1) / 2, y: doorTop + lh / 2, z: -((d.by0 + d.by1) / 2),
        data: { type: '门头过梁', label: `${F + 1}层门头墙`, color: '#a6adb9', floor: F },
      });
    }
  });
  addInstancedBoxes(doorPanels.door, interior, doorMat);
  addInstancedBoxes(doorPanels.shaft, interior, shaftMat);
  addInstancedBoxes(lintels.outer, shell, wallOuterMat);
  addInstancedBoxes(lintels.inner, interior, wallInnerMat);

  // 电梯井：井道墙 = 混凝土核心筒（四边薄墙，全高），井道内空腔由楼板洞贯通
  elevs.forEach((e, i) => {
    const ew = e.x1 - e.x0, ed = e.y1 - e.y0;
    const cx = (e.x0 + e.x1) / 2, cy = (e.y0 + e.y1) / 2;
    const t = 0.15, H = S.wall_h;
    const segs = [
      [ew + t * 2, t, cx, e.y0 - t / 2],   // 南边
      [ew + t * 2, t, cx, e.y1 + t / 2],   // 北边
      [t, ed + t * 2, e.x0 - t / 2, cy],   // 西边
      [t, ed + t * 2, e.x1 + t / 2, cy],   // 东边
    ];
    segs.forEach(([w, d, px, py], j) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), shaftMat);
      m.position.set(px, z + S.slab_t + H / 2, -py);
      m.castShadow = true; m.receiveShadow = true;
      m.userData = { type: '电梯井', label: `${F + 1}层电梯井墙 #${i + 1}-${j + 1}`, color: '#6b7280', floor: F, shaftW: e.w, shaftD: e.d };
      shell.add(m);
    });
  });

  // 入口台阶（仅首层）
  g.stairs.forEach((s, i) => {
    const top = 0.60 - i * 0.15;
    const back = s.nosing - 0.30;
    const depth = s.nosing - back;
    const geo = new THREE.BoxGeometry(2 * s.hw, 0.15, depth);
    const m = new THREE.Mesh(geo, stairMat);
    m.position.set(0, z + top - 0.075, -(back + depth / 2));
    m.castShadow = true; m.receiveShadow = true;
    m.userData = { type: '台阶', label: `台阶 #${i + 1}`, color: '#d0c198', floor: F };
    interior.add(m);
  });

  // 室内楼梯井：跑数自动判型（1=直跑 / 2=双跑 / 3=双分式），各跑用实测 x0/x1 定位
  // 顶层（无上层楼板）不画任何楼梯——楼梯井只剩楼板洞（下一层楼梯的到达点）
  g.stairwells.forEach((s, idx) => {
    if (isTop) return;
    const W = s.x1 - s.x0;
    const D = s.yTop - s.yBot;
    const N = Math.max(2, s.steps);
    const midH = LAYER_HEIGHT / 2;
    const cx = (s.x0 + s.x1) / 2;
    const stype = s.type || 'double';
    const flights = s.flights || [];
    const ld = Math.min(1.2, D * 0.3);
    const halfRise = LAYER_HEIGHT / (2 * N);
    const fw = (f) => f.x1 - f.x0;         // 跑宽
    const fcx = (f) => (f.x0 + f.x1) / 2;  // 跑中心 x

    if (stype === 'bifurcated' && flights.length >= 3) {
      // 双分式：中跑（宽）先上到平台，平台后分左右两窄跑反向各上半层高
      const k = Math.floor(flights.length / 2);
      const mid = flights[k];
      const sides = flights.filter((_, i) => i !== k);
      makeFlight(fcx(mid), fw(mid), s.yBot, s.yTop, z, halfRise, N, stairMat, shell, F, idx);
      for (const f of sides) {
        makeFlight(fcx(f), fw(f), s.yTop, s.yBot, z + midH, halfRise, N, stairMat, shell, F, idx);
      }
      const landing = new THREE.Mesh(new THREE.BoxGeometry(W, S.stair_landing, ld), stairMat);
      landing.position.set(cx, z + midH - S.stair_landing / 2, -(s.yTop - ld / 2));
      landing.castShadow = true; landing.receiveShadow = true;
      shell.add(landing);
    } else if (stype === 'straight' || flights.length === 1) {
      // 直跑：单跑全宽，一层高内 N 步
      makeFlight(cx, W, s.yBot, s.yTop, z, LAYER_HEIGHT / N, N, stairMat, shell, F, idx);
    } else {
      // double：双跑平行（两条跑反向各上半层高）
      if (flights.length >= 2) {
        makeFlight(fcx(flights[0]), fw(flights[0]), s.yBot, s.yTop, z, halfRise, N, stairMat, shell, F, idx);
        makeFlight(fcx(flights[flights.length - 1]), fw(flights[flights.length - 1]), s.yTop, s.yBot, z + midH, halfRise, N, stairMat, shell, F, idx);
      } else {
        const flightW = W / 2;
        makeFlight(cx - flightW / 2, flightW, s.yBot, s.yTop, z, halfRise, N, stairMat, shell, F, idx);
        makeFlight(cx + flightW / 2, flightW, s.yTop, s.yBot, z + midH, halfRise, N, stairMat, shell, F, idx);
      }
      const landing = new THREE.Mesh(new THREE.BoxGeometry(W, S.stair_landing, ld), stairMat);
      landing.position.set(cx, z + midH - S.stair_landing / 2, -(s.yTop - ld / 2));
      landing.castShadow = true; landing.receiveShadow = true;
      shell.add(landing);
    }
  });

  // 结构柱（每层贯通）
  g.columns.forEach((c, i) => {
    const geo = new THREE.BoxGeometry(c.w, S.wall_h, c.d);
    const m = new THREE.Mesh(geo, columnMat);
    m.position.set(c.x, z + S.slab_t + S.wall_h / 2, -c.y);
    m.castShadow = true; m.receiveShadow = true;
    m.userData = { type: '结构柱', label: `${F + 1}层结构柱 #${i + 1}`, color: '#9aa2b0', floor: F, w: c.w, d: c.d };
    shell.add(m);
  });

  // 屋顶 + 中央女儿墙（仅顶层）；浏览单层时由 setFloor 隐藏，可看进楼内
  if (isTop) {
    const topY = z + S.floor_h;
    const st = S.style || {};
    if (st.roofType === 'gable') {
      renderGableRoof(g.outline, topY, F, shell);   // 苏式坡顶（无女儿墙，屋面出檐）
    } else {
      const roof = addExtrude(makeShape(g.outline), null, S.roof_t, roofMat, topY);
      roof.userData = { type: '屋顶', label: '屋面板', color: '#' + roofMat.color.getHexString(), floor: F };
      shell.add(roof);
      roofMeshes.push(roof);
      renderParapetRing(g.outline, topY, F, shell);
    }
    // 翼楼屋面楼板：阶梯结构下翼楼屋面 = 下层满 footprint − 顶层中央主体，
    // 标高在本层楼板底部 z（= 下一层顶部），与翼楼屋面女儿墙同标高。
    const wingRoof = g.roof && g.roof.wingRoof;
    if (wingRoof) {
      wingRoof.forEach((wr) => {
        const m = addExtrude(makeShape(wr), null, S.roof_t, roofMat, z);
        m.userData = { type: '屋顶', label: '翼楼屋面板', color: '#' + roofMat.color.getHexString(), floor: F };
        shell.add(m);
        roofMeshes.push(m);
        renderParapetRing(wr, z, F, shell, '翼楼女儿墙');   // 翼楼屋面女儿墙（同 GLB add_parapet）
      });
    }
  }

  shellGroup.add(shell);
  shellFloorGroups.push(shell);
  floorGroups.push(interior);
  scene.add(interior);
}

// ---------- SU 规格渲染（?su=1）----------
// 装进与 renderFloor **同一份契约**（floorGroups / shellFloorGroups / wallMeshes / roomMeshes / roofMeshes），
// 于是楼层工具条、墙体显隐、用途图例、中文标注、点击面板全部白拿，一行都不用改。
// 分组键优先读上游**显式**字段 `group`（SU 里那 7 个顶层组），`floor` 只作兜底 —— 拿派生量当分组键，
// 一旦出现哨兵值就会长出假楼层（见记忆 sentinel-key-in-derived-grouping）。
const SU_OUT_GROUPS = ['屋顶', '场地'];                 // 整栋尺度，不是楼层（浏览单层时与屋面板一起隐藏）
function suFloorOf(p) {
  const g = String(p.group == null ? '' : p.group);
  const m = /^F(\d+)$/.exec(g);                         // F0..F4 → 0..4
  if (m) return parseInt(m[1], 10);
  if (SU_OUT_GROUPS.indexOf(g) >= 0) return 'out';
  // 兜底：上游没给 group 时用 floor。★ 但"没见过的组名"和"压根没有组名"是两件事，都要说出来
  //   （跳过谁就说谁）：不认得的组名哪怕有 floor 也是**替它做了一次归层决定**，得留痕。
  if (typeof p.floor === 'number' && p.floor >= 0) {
    if (g) console.warn('SU 规格里出现没见过的 group=%o（按它自己的 floor=%o 归层）', p.group, p.floor);
    return p.floor;
  }
  console.warn('SU 规格里出现没见过的 group=%o，且没有可用的 floor（按整栋尺度处理）', p.group);
  return 'out';
}
// 逐三角写顶点色：**三个顶点的挤出轴 z 全相等 ⇒ 是顶/底盖**（盖是一个平面），用 cap；
// 侧面必跨两个 z，按**截面重心就近**找它属于哪条边，取那条边的 edgeCols。
// 边 i = ext[i] → ext[(i+1) % n]（环靠首尾相接闭合：实测 len(edgeCols) == len(ext)，30 点的外墙配 30 个色）；
// 洞同理，且 holeEdgeCols 是**逐洞**的嵌套数组（不是一张扁平表，实测 [[c,c,c,c]]）。洞边色缺失就回落 cap。
const _suRGBCache = new Map();
function suRGB(hex) {
  let c = _suRGBCache.get(hex);
  if (!c) { const t = new THREE.Color(hex); c = [t.r, t.g, t.b]; _suRGBCache.set(hex, c); }
  return c;
}
function suPaint(geo, p) {
  const pos = geo.attributes.position, n = pos.count;
  const capHex = p.cap || '#cccccc';
  const cap = suRGB(capHex);
  const segs = [];
  const ext = p.ext || [];
  for (let i = 0; i < ext.length; i++) {
    const a = ext[i], b = ext[(i + 1) % ext.length];
    segs.push([a[0], a[1], b[0], b[1], suRGB((p.edgeCols && p.edgeCols[i]) || capHex)]);
  }
  (p.holes || []).forEach((h, hi) => {
    const hc = (p.holeEdgeCols && p.holeEdgeCols[hi]) || null;
    for (let i = 0; i < h.length; i++) {
      const a = h[i], b = h[(i + 1) % h.length];
      segs.push([a[0], a[1], b[0], b[1], suRGB((hc && hc[i]) || capHex)]);
    }
  });
  const col = new Float32Array(n * 3);
  for (let t = 0; t < n; t += 3) {
    const z0 = pos.getZ(t), z1 = pos.getZ(t + 1), z2 = pos.getZ(t + 2);
    let c = cap;
    if (!(Math.abs(z0 - z1) < 1e-6 && Math.abs(z1 - z2) < 1e-6)) {      // 三个顶点的 z 不等 ⇒ 侧面
      const mx = (pos.getX(t) + pos.getX(t + 1) + pos.getX(t + 2)) / 3;
      const my = (pos.getY(t) + pos.getY(t + 1) + pos.getY(t + 2)) / 3;
      let best = Infinity;
      for (const s of segs) {
        const d = pointToSegDist(mx, my, s[0], s[1], s[2], s[3]);
        if (d < best) { best = d; c = s[4]; }
      }
    }
    for (let k = 0; k < 3; k++) {
      col[(t + k) * 3] = c[0]; col[(t + k) * 3 + 1] = c[1]; col[(t + k) * 3 + 2] = c[2];
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
// 投影阴影只留给**挡光的那些**（墙/板/屋面/柱/场地）：理化楼 3680 件里 1565 件是窗，
// 全开等于每帧多 1565 次 shadow pass 的 draw call，而屏幕上看不出区别。
const SU_CAST = ['墙', '楼板', '屋顶', '柱', '场地'];
function suMaterialOf(p) {
  if (p.sub === '玻璃') return suMatGlass;
  if (p.sub === '窗框') return suMatFrame;
  if (p.cat === '墙' || p.sub === '女儿墙') return suMatWall;
  return suMatOpaque;
}
function renderSu() {
  const parts = (suSpec && suSpec.parts) || [];
  // 楼层容器**按 FLOOR_COUNT 全建出来（空层也建）**：setFloor 是按**下标**翻 visible 的，
  // 少建一层，后面每一层都错位一格（表现就是"点 3 层少了那层、多了另一层"）。
  const shellByFloor = [], innerByFloor = [];
  for (let F = 0; F < FLOOR_COUNT; F++) {
    const sh = new THREE.Group(), inner = new THREE.Group();
    inner.name = `su-floor-${F}`;
    shellGroup.add(sh);
    scene.add(inner);
    shellFloorGroups.push(sh);      // 与默认路径一样按「外壳 / 内部」分装（下标与 floorGroups 对齐）
    floorGroups.push(inner);
    shellByFloor.push(sh); innerByFloor.push(inner);
  }
  const outGroup = new THREE.Group();      // 屋顶/场地：整栋尺度
  scene.add(outGroup);
  suExtraGroups.push(outGroup);

  // ★ 兜底灰要**说出来**：cap 缺失时 suPaint 用 #cccccc 顶上（不然这件没有颜色可画），
  //   但"我替它挑了一个颜色"必须有人看得见 —— 静默替色和"面板说了算、几何没跟上"是同一类错。
  const noCap = [];
  parts.forEach((p, i) => { if (!p.cap) noCap.push(i); });
  if (noCap.length) {
    console.warn('SU 规格里 %d 件没有 cap，这些件按兜底灰 #cccccc 画（前几个 parts 下标：%s）',
                 noCap.length, noCap.slice(0, 5).join(', '));
  }
  parts.forEach((p, pi) => {
    const f = suFloorOf(p);
    const isPad = p.cat === '地垫';
    // 地垫 = 房间：走**与默认路径逐字相同**的 roomMaterial(roomColor(purpose))，
    // 于是图例、压暗筛选、切配色（setPurposeColor/applyDim）、?purpose=0 全部零改动可用。
    // spec 的地垫 cap 就是 SU 的用途色，与页面的 13 个合同色同值（由 check 脚本逐件断言，不假设）。
    const hex = isPad ? roomColor(p.purpose) : null;
    const m = addExtrude(makeShape(p.ext), (p.holes && p.holes.length) ? p.holes : null,
                        p.z1 - p.z0, isPad ? roomMaterial(hex) : suMaterialOf(p), p.z0);
    if (!isPad) suPaint(m.geometry, p);    // 地垫整块一个色（spec 里地垫的 edgeCols 实测都是空的），不必逐面
    m.castShadow = SU_CAST.indexOf(p.cat) >= 0;
    m.receiveShadow = true;
    if (isPad) {
      const meta = roomMeta({ poly: p.ext });   // 面积/锚点：复用页内同一套（p.ext 是首≠末的闭合环写法）
      m.userData = { type: '房间', number: p.roomNo, floor: f, purpose: p.purpose || '',
                     area: meta.area, ax: meta.ax, ay: meta.ay,
                     label: `${p.roomNo} ${p.purpose || ''}`.trim(), color: hex, suColor: p.cap,
                     su: true, pi, cat: p.cat, sub: p.sub, group: p.group, z0: p.z0, z1: p.z1, nf: p.nf };
      roomMeshes.push(m);
    } else {
      m.userData = { type: 'SU件', label: `${p.group} · ${p.sub}`,
                     floor: (typeof f === 'number') ? f : null,   // 整栋尺度那几件不谎报层号（面板显 '—'）
                     su: true, pi, cat: p.cat, sub: p.sub, group: p.group,
                     z0: p.z0, z1: p.z1, nf: p.nf, nholes: (p.holes || []).length, color: p.cap };
    }
    pickables.push(m);          // 逐件入册：件件可点、可查"这是 SU 里的哪一件"（默认路径是整场 traverse）
    // 归仓（与默认路径同一套语义）：
    //   · 墙 → wallMeshes：「墙体 ✗」整批隐藏（含外墙内皮/外皮逐面色，走的还是同一个材质）
    //   · 屋顶（含女儿墙）+ 屋顶/场地那组 → roofMeshes：浏览单层时隐藏，看进楼内
    //   · 其余按层进 shell（外墙/楼板/屋面）/ interior（内墙/地垫/门窗柱梯）
    if (p.cat === '墙') wallMeshes.push(m);
    if (p.cat === '屋顶' || f === 'out') { outGroup.add(m); roofMeshes.push(m); }
    // ★ 层号越界要有话说：`shellByFloor[f]` 是 undefined 时 `.add()` 会抛 TypeError，把整栋 3680 件
    //   一起带崩（画面停在半栋、控制台只有一句看不懂的报错）。真撞上就归到整栋尺度那组并点名。
    else if (!shellByFloor[f] || !innerByFloor[f]) {
      console.warn('SU 规格第 %d 件的层号 %o 超出 0..%d（按整栋尺度处理）：group=%o floor=%o',
                   pi, f, FLOOR_COUNT - 1, p.group, p.floor);
      outGroup.add(m); roofMeshes.push(m);
    }

}

let legendPurposes = 0;      // 图例**真正代表多少种用途**（长尾折叠后行数会少 —— 断言认这个数，不认行数）
let dimPurpose = null;       // 点中的用途（其余压暗）；null = 不压暗

// 「眼前看到的房间」= 当前可见层的地垫。可见性直接读所属层组的 visible，不另立 flag（避免两处状态打架）。
function visibleRooms() {
  return roomMeshes.filter((m) => m.parent && m.parent.visible);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function applyDim() {
  // keep 用 roomColor(dimPurpose) 而不是 purposeColorHex：?purpose=0 时缓存键是旧色值，得走同一个分发。
  const keep = dimPurpose === null ? null : roomColor(dimPurpose);
  roomMatCache.forEach((mat, hex) => {
    const base = mat.userData.base;
    if (keep === null || hex === keep) mat.color.copy(base);
    else mat.color.copy(base).lerp(DIM_TARGET, 0.82);
  });
}
function renderLegend() {
  legendPurposes = 0;
  if (!legendOn || !legendBox) { if (legendBox) legendBox.style.display = 'none'; return; }
  const rooms = visibleRooms();
  const byPurpose = new Map();
  for (const m of rooms) {
    const p = m.userData.purpose || '';
    byPurpose.set(p, (byPurpose.get(p) || 0) + 1);
  }
  legendPurposes = byPurpose.size;      // ← 不管折不折叠，这个数必须是"可见房间里有多少种用途"
  const head = '<div class="h">房间用途</div>';
  if (!rooms.length) {
    legendBox.innerHTML = head + '<div class="na">本楼无房间用途数据</div>';
    legendBox.style.display = 'block';
    return;
  }
  const scope = currentFloor === 'all' ? `整栋 ${FLOOR_COUNT} 层` : `${currentFloor + 1} 层`;
  const rows = [...byPurpose.entries()].sort((a, b) => (b[1] - a[1]) || String(a[0]).localeCompare(String(b[0]), 'zh'));
  // 长尾折叠：前 12 名之外、且只有 1 间的收进「其他」——c026 实测 35 种用途，不折叠会撑满一屏。
  const keep = rows.filter((r, i) => i < 12 || r[1] > 1);
  const tail = rows.slice(keep.length);
  let html = head + `<div class="sub">${scope} · ${rooms.length} 间 · ${legendPurposes} 种用途</div>`;
  if (autoSwitchNote) {
    html += '<div class="sub note">已自动切到 1 层：整栋视距下标注会叠成一团，逐层看更清楚。'
          + '想看整栋，把「标注」关掉即可。</div>';
  }
  const dimmed = dimPurpose !== null;

    const on = !dimmed || dimPurpose === p;
    html += `<div class="row${on ? '' : ' dim'}" data-p="${escapeHtml(p)}" title="点击只看这一类">`
          + `<span class="sw" style="background:${roomColor(p)}"></span>`
          + `<span class="nm">${escapeHtml(nm)}</span><span class="ct">${n}</span></div>`;
  }
  if (tail.length) {
    const tn = tail.reduce((s, r) => s + r[1], 0);
    html += `<div class="row tail">其他 ${tail.length} 种 · ${tn} 间</div>`;
  }
  legendBox.innerHTML = html;

  legendBox.querySelectorAll('.row[data-p]').forEach((el) => {
    el.addEventListener('click', () => {

}

// ---------- 房间中文标注（DOM 投影，不引 CSS2DRenderer）----------
// 为什么不引 CSS2DRenderer：投影只用现成的 camera 与渲染循环，零新增依赖；
// 而引入它就要在 importmap 里多一条 —— 本页的依赖表是**手写的**（不是打包器算的），
// 每多一条就多一处"写了没人核对"的地方。★ 原先这里写的是「多一个 unpkg 外部依赖
// （内网/断网直接白屏）」：three 已在 2026-09-25 换成仓内 `frontend/site/vendor/`，
// "CDN" 这半句不再成立，但**结论没变**（依赖表越短越不容易与实际情况脱节）。
const labelLayer = document.getElementById('labelLayer');
let labelItems = [];        // [{el, x, y, z}] 世界坐标；世界 = (ax, F*层高+板厚+垫厚, -ay)
let labelShown = 0;
let lastCamKey = '';
const LABEL_H = 16;

function clearLabels() {
  labelItems = [];
  labelShown = 0;
  lastCamKey = '';
  if (labelLayer) labelLayer.textContent = '';
}
function textWidth(s) {
  let w = 12;
  for (const ch of s) w += /[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? 12 : 6.5;   // 用转义写：中日韩与全角标点算全宽
  return w;
}
function refreshLabels() {
  clearLabels();
  if (!labelsOn || !labelLayer) return;
  // 只标单层：整栋视距下 118~480 条必叠成一团墨（SU 封面图已踩过）。开了标注就自动落到 1 层。
  // ★ 跳层必须**说出来**：不然用户点「标注 ✓」之后看到的是"楼层按钮自己跳了一下、我还停在某一层"，
  //   会误以为是 bug。提示走图例的 .sub 行（#hint 是常驻帮助文本，覆盖它会把操作说明弄丢）。
  if (currentFloor === 'all' && FLOOR_COUNT > 1) {
    setFloor(0);              // setFloor 会清 autoSwitchNote，所以先落层、再立标志
    autoSwitchNote = true;
    renderLegend();           // 重渲染一次，把提示挂上
    return;
  }
  const cand = visibleRooms()
    .filter((m) => (m.userData.area || 0) >= labelMinArea)
    .sort((a, b) => (b.userData.area || 0) - (a.userData.area || 0));
  for (const m of cand.slice(0, labelMax)) {
    const u = m.userData;
    const el = document.createElement('div');
    el.className = 'rl';
    el.innerHTML = `<span class="n">${escapeHtml(u.number || '')}</span> `
                 + escapeHtml(u.purpose || UNKNOWN_LABEL);
    labelLayer.appendChild(el);
    labelItems.push({ el, x: u.ax, y: u.floor * LAYER_HEIGHT + S.slab_t + ROOM_PAD + 0.02, z: -u.ay, text: el.textContent });
  }
  updateLabels(true);
}
function updateLabels(force) {
  if (!labelsOn || !labelItems.length) { labelShown = 0; return; }
  // ★ 相机静止就跳过：不改 DOM、不投影（不然每帧 60 次 layout 读取，浏览器会被拖住）
  const key = `${labelItems.length}|${innerWidth}x${innerHeight}|`
            + camera.matrixWorld.elements.map((v) => v.toFixed(4)).join(',');
  if (!force && key === lastCamKey) return;
  lastCamKey = key;
  const v = new THREE.Vector3();
  const taken = [];
  let shown = 0;
  for (const it of labelItems) {
    v.set(it.x, it.y, it.z).project(camera);
    let hit = v.z >= -1 && v.z <= 1;
    let l = 0, t = 0, w = 0;
    if (hit) {
      const sx = (v.x * 0.5 + 0.5) * innerWidth, sy = (-v.y * 0.5 + 0.5) * innerHeight;
      w = textWidth(it.text); l = sx - w / 2; t = sy - LABEL_H / 2;
      hit = l >= 0 && t >= 0 && l + w <= innerWidth && t + LABEL_H <= innerHeight;
      if (hit) {
        for (const [a, b, c, d] of taken) {          // 屏内贪心去重叠（按面积降序，大的先占）
          if (l < a + c && a < l + w && t < b + d && b < t + LABEL_H) { hit = false; break; }
        }
      }
    }
    if (hit) {
      taken.push([l, t, w, LABEL_H]);
      shown++;
      it.el.style.transform = `translate3d(${Math.round(l)}px,${Math.round(t)}px,0)`;
    } else {
      it.el.style.transform = 'translate3d(-9999px,-9999px,0)';   // 被压掉的移出屏（不是删 DOM，下帧还能回来）
    }
  }
  labelShown = shown;
}

function isEffectivelyVisible(obj) {

// 后端地址：**代码里不留死端口**。
//   生产：nginx 把 /api 与前端放在同一个源上 → 留空即同源，什么都不用配。
//   本地：静态站(8000)与后端不同源，二选一 ——
//         ① 地址栏加 ?api=http://127.0.0.1:<后端端口>
//         ② 页面里先写 window.GYM3D_API_BASE = 'http://127.0.0.1:<后端端口>'
const API_BASE = new URLSearchParams(location.search).get('api')
  ?? window.GYM3D_API_BASE ?? '';
// 房间数据（`roomMap` 供点击查信息、「路径规划」下拉）按**楼**取，两个硬约束都实测过：
//
// ① **必须带 building**。`build_path.compute_path` 的文档串写着「building=None 指理化楼基线」，
//    所以不带 building 时：c006 页面上选 c006 房号 ⇒ `未找到房间 6-A-01-00`；
//    选 lihua 房号 ⇒ 算出**理化楼的路径画在 c006 的几何上**（静默给错答案）。
//    实测 `from_id=8&to_id=2` 带不带 building 结果一模一样（10.82 m）—— 它真的会静默回落。
// ② **一条 URL 只能发一次**。整库这条响应实测 **18.6 MB / 8688 行**，而原先两处各自 fetch 同一
//    URL（roomMap 与路径下拉）。实测同 URL 并发请求里第二个卡到 **73473 ms**
//    （`_scratch/_viewer_path_selects_diag.py`，第一个 2409 ms），于是下拉超过一分钟是空的、
//    且**控制台零 error**（fetch 只是挂着，`.catch` 不触发）。按楼缓存 ⇒ 一栋只拉一次。
const roomsByBuilding = new Map();
function roomsOf(building) {
  if (!building) return Promise.resolve({ data: [] });
  if (!roomsByBuilding.has(building)) {
    const p = fetch(API_BASE + '/api/rooms?building=' + encodeURIComponent(building))
      .then(res => res.json())
      // ★ HTTP 非 2xx **不会**让 fetch 失败 —— 它照常 resolve，只是 body 成了个错误信封。
      //   实测（2026-09-25，把 LIHUA_DB_PORT 指到一个死端口）：这一条回 **503**
      //   `{success:false, data:null, error:{message:"连不上房间库：ConnectionTimeout: …"}}`，
      //   而下游 `res.data || []` 把 `null` 洗成 `[]` ⇒ 面板上写的是**「本楼没有房间数据」**。
      //   「读不到」与「真的没有」补救办法完全不同，屏幕上却是同一句话（本仓铁律 18 那一族）。
      //   更毒的是它**会被按楼缓存住**（`roomsByBuilding` 上面那句注释「失败不缓存，留重试机会」
      //   根本没轮到）⇒ PG 抖一下，这栋楼在本页余生里就永远读不到房间，即使 PG 立刻恢复。
      //   ⇒ 所以在这里判成败，让它落进**下面那个已有的 `.catch`**（清缓存 + 重抛），
      //     由 `loadRoomsFor` 的失败分支给出「加载失败」那句话并清掉重试记号。
      //     判据用 `Array.isArray(data)`：接口成功时 `data` 恒为数组
      //     （`routers/rooms.py` 的 `meta={"total": len(data)}` 就要求它是序列），
      //     所以真·空楼拿到的是 `[]` —— 会走「没有房间」那一支，不会被误判成失败。
      .then((body) => {
        // ★ 这一条是防"我自己"的，实测踩过一次：改动前漏掉了上面那步 `.then(res => res.json())`，
        //   于是 `body` 是 **Response 对象** —— `success`/`data` 全是 `undefined` ⇒ 下面那条判据
        //   对所有响应**恒真**（连 200 也判失败），而面板上只说「接口没有返回房间列表」，
        //   读起来像个服务端问题。**200 也走失败分支**这件事本身就该喊出来，而不是伪装成上游的错。
        if (body && typeof body.json === 'function') {
          throw new Error('内部错误：房间响应没解析（漏了 res.json()）');
        }
        if (!body || body.success === false || !Array.isArray(body.data)) {
          const m = (body && body.error && (body.error.message || body.error)) || '接口没有返回房间列表';
          throw new Error(String(m).split('\n')[0]);   // 只留首行：服务端的 psycopg 原文是多行的
        }
        return body;
      })
      .catch((err) => { roomsByBuilding.delete(building); throw err; });  // 失败不缓存，留重试机会
    roomsByBuilding.set(building, p);

const roomMap = {};

function setRay(ev) {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}

function describeFace(n) {
  const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  if (ay > 0.85) return n.y > 0 ? '顶面（朝上）' : '底面（朝下）';
  if (ax > 0.85) return n.x > 0 ? '东立面' : '西立面';
  if (az > 0.85) return n.z > 0 ? '南立面' : '北立面';
  return '斜/角面';
}

let selected = null, origMat = null, selectedInstance = null;
// 命中数据反查：InstancedMesh 按 instanceId 取 userData.instances[i]，普通 mesh 取 userData
function resolveHitData(hit) {
  const obj = hit.object;
  if (hit.instanceId != null && obj.userData && Array.isArray(obj.userData.instances)) {
    return obj.userData.instances[hit.instanceId];

  return obj.userData;
}
function select(mesh, instanceId) {
  clearSelect();
  if (instanceId != null) {
    // InstancedMesh：instanceColor 高亮单实例。先全白避免其它实例被默认黑染色，再单绿。
    if (mesh.instanceColor == null) {
      mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(mesh.count * 3).fill(1), 3);
    }
    selected = mesh; selectedInstance = instanceId;
    mesh.setColorAt(instanceId, new THREE.Color(0x33ff99));
    mesh.instanceColor.needsUpdate = true;
    return;
  }
  selected = mesh; origMat = mesh.material;
  // 墙是**材质数组**（按面配色用了 group：0=盖/1=外墙/2=室内），数组没有 .clone()，
  // 所以统一按数组处理，单材质只是长度 1 的特例。
  const src = Array.isArray(origMat) ? origMat : [origMat];
  const hi = src.map((mm) => {
    const c = mm.clone();
    c.emissive = new THREE.Color(0x33ff99);
    c.emissiveIntensity = 0.55;
    return c;
  });
  mesh.material = Array.isArray(origMat) ? hi : hi[0];
}
function clearSelect() {
  if (!selected) return;
  if (selectedInstance != null) {
    selected.setColorAt(selectedInstance, new THREE.Color(1, 1, 1));
    selected.instanceColor.needsUpdate = true;
    selectedInstance = null;
  } else {
    const cur = selected.material;
    (Array.isArray(cur) ? cur : [cur]).forEach((mm) => mm.dispose());
    selected.material = origMat;
  }
  selected = null; origMat = null;
}

function buildInfo(u, n, p) {

  }
  const head = `<div class="t">${esc(u.type)}${u.label ? ' · ' + esc(u.label) : ''}</div>`;
  let body = `<div><b>楼层</b> ${F}</div>` + roomHintTip();
  if (u.type === '门' || u.type === '电梯门') {
    body += `<div><b>门宽</b> ${u.w != null ? u.w.toFixed(2) + ' m' : '—'}</div>`;
    body += `<div><b>门高</b> ${u.h != null ? u.h.toFixed(2) + ' m' : '—'}</div>`;

    body += `<div><b>墙高</b> ${u.height != null ? u.height.toFixed(2) + ' m' : '—'}</div>`;

function clearBuilding() {

  //   顶点色），不归还的话在页面里来回切几栋，上一栋的缓冲一直挂着（three 只在 dispose 时释放）。
  //   只清**几何**、不清材质：suMatWall / wallOuterMat / roomMatCache 都是跨楼复用的。
  //   只清"马上要被摘掉的那些组"里的几何 —— 场景里其余 mesh 的几何一根都不碰。
  [floorGroups, shellFloorGroups, suExtraGroups].forEach((arr) => arr.forEach((g) => {
    g.traverse((o) => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
  }));
  floorGroups.forEach((g) => scene.remove(g));
  shellFloorGroups.forEach((g) => shellGroup.remove(g));
  suExtraGroups.forEach((g) => scene.remove(g));      // ?su=1 的整栋尺度那组（默认路径下这个数组是空的）
  suExtraGroups.length = 0;
  floorGroups.length = 0;
  shellFloorGroups.length = 0;
  wallMeshes.length = 0;
  roofMeshes.length = 0;
  roomMeshes.length = 0;      // ★ roomMatCache **不**清：颜色是纯函数，跨楼复用（见 roomMaterial）
  clearLabels();
  pickables.length = 0;

  //   而 rebuild() 每次改参数（切窗户/改窗宽…）都会走到这里 ⇒ 面板会一直声称有一条**已经不在
  //   场景里**的路径。这正是本次要收口的那一类"面板说了算、几何没跟上"。
  //   （pathGo 的失败分支是先写文字再 clearPath，所以这里不能把清文字塞进 clearPath 内部。）
  pathInfo.textContent = '';

  dimPurpose = null;

  if (suMode && suSpec) renderSu();

  geometryBuilding = currentBuilding;

  loadRoomsFor(currentBuilding);
