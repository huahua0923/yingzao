<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园数字孪生平台 · 成都理工大学</title>
<meta name="description" content="成都理工大学校园数字孪生平台：一张底图看全校，点开一栋看每层功能与使用单位。">

<!--
  ★★ 这一页**没有 importmap**，因为一条裸模块名都不用了。

    原来这里有一份 three.js 的 importmap，指向 `/site/vendor/three/`（0.185.1，无 CDN）。
    它服务的是 `js/scene.js` —— 那块"贴在纸面上的 three 展板"，已随 2026-10-02
    的「一个世界」重做退役（世界改由 Cesium 实景 3D Tiles 铺满，见 `js/world/`）。
    scene.js **一个引用方都没有**才是它退场的依据，不是"我认为没人用"。

    现在唯一的外部库是 Cesium（`./vendor/cesium/`，离线包，**不进 git**）。
    ★ 它必须走**经典 `<script src>`**，不能走 `await import()` —— 实测过：
      动态 import 进来会丢 WebGL 上下文，而且报出来的是
      「Fragment shader failed to compile. Compile log: null」这种与真因无关的话。
      （详见 `js/world/world.js` 顶上那段。）
  ★ 仍然不引任何 CDN：本平台要放在**校内网**跑，断网必须照常工作。
-->

<link rel="stylesheet" href="./portal.css">

<!--
  ★ 图标走 **data URI**，不是放一个 /favicon.ico 文件。两个理由：
    ① 不放文件 ⇒ 那条请求根本不存在，也就没有"没放到"这一种坏法；
    ② 浏览器在页里找不到 `<link rel=icon>` 时会去要 `/favicon.ico`，
       而本平台没有这个文件 ⇒ 控制台**每次**都多一条 404（实测：服务端日志里
       `GET /favicon.ico 404` 出现十几次，就是门户页自己在要）。
  ★ 形状照抄顶栏那枚 `.mark`（`portal.css:254`）：朱色方块切掉右下角，
    与三维里的体块同形 —— 用同一枚记号，不另画一个。
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080b10'/%3E%3Cpath d='M6 6H26V18.4L18.4 26H6Z' fill='%23FF7A45'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#stage">跳到主区</a>

<!-- 登录闸：未登录时**只有这一块**，主界面一行数据都装配不出来（见 js/session.js）。 -->
<section id="gate" class="gate" hidden>
  <div class="gate-card">
    <p class="gate-brand"><span class="mark" aria-hidden="true"></span>校园数字孪生平台</p>
    <h1>登录</h1>
    <p class="gate-sub">成都理工大学 · 校园空间与房屋管理</p>
    <form id="loginform" autocomplete="on">
      <label for="u">用户名</label>
      <input id="u" name="username" autocomplete="username" required>
      <label for="p">口令</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button id="loginbtn" type="submit">登 录</button>
      <p id="loginmsg" class="gate-msg" role="alert"></p>
    </form>
    <p class="gate-foot">仅限校内网访问。<br>账号由平台管理员分配。</p>
  </div>
</section>

<!-- 主界面骨架：外壳（导航 / 主区 / 详情）三栏。内容全部由 js/app.js 装配。 -->
<div id="shell" class="shell" hidden>

  <header class="topbar">
    <p class="brand"><span class="mark" aria-hidden="true"></span></p>
    <p class="app-title">校园数字孪生平台<em>成都理工大学</em></p>
    <div class="topbar-right">
      <span id="clock" class="clock" aria-hidden="true"></span>
      <span id="who" class="who"></span>
      <button id="logout" class="ghost" type="button">退出</button>
    </div>
  </header>

  <!-- ★★ 导轨里**预设**一个署名容器（Cesium 的 credit 往这里挂）。
       为什么它必须写在这里、而不是由 `paintRail()` 建：
         · `paintRail()` 里第一句是 `fill(rail)`（清空再画）⇒ 由它建就得每次重建，
           而 Cesium 只认**建 viewer 那一刻**拿到的那个元素；
         · 而 `S.scene.boot()`（`app.js:411`）跑在 `paintRail()`（`:427`）**之前**
           ⇒ 由 paintRail 建的话，viewer 建起来的时候这个元素**还不存在**。
       写在这儿两个问题一起没了：`fill()` 只是把它摘下来，`paintRail()` 末尾再挂回去，
       对象始终是同一个。 -->
  <nav id="rail" class="rail" aria-label="功能模块">
    <div id="credit" class="credit"></div>
  </nav>

  <main id="stage" class="stage">
    <!-- ★★ 世界：2024 实景 3D Tiles **铺满整块视口**，它不再是一块"展板"。
         下面那五块都是**浮在它上面的 HUD 图层**（`position:absolute`），
         不是与它并列的兄弟。 -->
    <div id="world" class="world">
      <div id="hint" class="hint"></div>
      <div id="legend" class="legend"></div>
      <div id="scene-note" class="scene-note"></div>
      <div id="stage-bar" class="stage-bar"></div>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <!-- 模块的表格 / 表单 / 说明。★ 它现在也是**浮层**（HUD），不再把世界挤走。 -->
    <div id="doc" class="doc hud" hidden></div>
  </main>

  <aside id="panel" class="panel" aria-label="详情"></aside>

</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
