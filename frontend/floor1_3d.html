const OUTER_H = 4.2;     // 外墙高（层高，体量）
const DOOR_H = 2.1;      // 标准门高（外墙入口门）
const baseMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.95 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a7d86, roughness: 0.9 });
const wallOuterMat = new THREE.MeshStandardMaterial({ color: 0x8b8e98, roughness: 0.9 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0xc4965c, roughness: 0.8 });
const stairMat = new THREE.MeshStandardMaterial({ color: 0xd0c198, roughness: 0.9 });
const roomColor = (p) => {
  if (p === '实验准备间') return 0xb9c8d4;   // 蓝灰
  if (p === '值班室') return 0xd8c6a8;       // 暖橙
  return 0xeae4d8;                            // 实验室 米白
};

function makeShape(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}
function addExtrude(shape, holes, depth, mat, y0) {
  if (holes) for (const h of holes) {
    const hp = new THREE.Path();
    hp.moveTo(h[0][0], h[0][1]);
    for (let i = 1; i < h.length; i++) hp.lineTo(h[i][0], h[i][1]);
    hp.closePath();
    shape.holes.push(hp);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotateX(-Math.PI / 2);          // shape(xy) 挤 z -> xz 平面挤出 y(高)
  mesh.position.y = y0 || 0;
  return mesh;
}

// 楼板基底（outline，厚 SLAB）
{
  const m = addExtrude(makeShape(GEOM.outline), null, SLAB, baseMat, 0);
  m.userData = { type: '楼板', label: '楼板基底', color: '#2a2f3a' };
  scene.add(m);
}
// 房间色块（顶面略高于楼板顶，避免 z-fighting；按用途配色）
GEOM.rooms.forEach((r) => {
  const c = roomColor(r.purpose);
  const m = addExtrude(makeShape(r.poly), null, SLAB + 0.01,
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }), 0);
  m.userData = { type: '房间', id: r.id, number: r.number,
                 label: `${r.number} ${r.purpose || ''}`.trim(),
                 color: '#' + c.toString(16).padStart(6, '0') };
  scene.add(m);
});
// 内墙（矮，带门洞，坐在地板顶）
GEOM.innerWalls.forEach((w, i) => {
  const m = addExtrude(makeShape(w.outer), w.holes, WALL_H, wallMat, SLAB);
  m.userData = { type: '内墙', label: `内墙 #${i + 1}`, color: '#7a7d86', holes: w.holes.length };
  scene.add(m);
});
// 外墙（高，到层高）
GEOM.outerWalls.forEach((w, i) => {
  const m = addExtrude(makeShape(w.outer), w.holes, OUTER_H, wallOuterMat, SLAB);
  m.userData = { type: '外墙', label: `外墙 #${i + 1}`, color: '#8b8e98', holes: w.holes.length };
  scene.add(m);
});
// 门：嵌进墙洞的一块木色块；外墙入口门用标准门高，内墙门跟矮墙同高
GEOM.doors.forEach((d, i) => {
  const h = d.outer ? DOOR_H : WALL_H, t = 0.30;
  const geo = d.horiz ? new THREE.BoxGeometry(d.w, h, t) : new THREE.BoxGeometry(t, h, d.w);
  const m = new THREE.Mesh(geo, doorMat);
  m.position.set(d.x, SLAB + h / 2, -d.y);
  m.userData = { type: '门', label: `门 #${i + 1}${d.outer ? '（外墙）' : '（内墙）'}`, color: '#c4965c' };
  scene.add(m);
});
// 台阶（南向入口踏步）
GEOM.stairs.forEach((s, i) => {
  const top = 0.60 - i * 0.15;
  const back = s.nosing - 0.30;
  const depth = s.nosing - back;
  const geo = new THREE.BoxGeometry(2 * s.hw, 0.15, depth);
  const m = new THREE.Mesh(geo, stairMat);
  m.position.set(0, top - 0.075, -(back + depth / 2));
  m.userData = { type: '台阶', label: `台阶 #${i + 1}`, color: '#d0c198' };
  scene.add(m);
});
// 室内楼梯井（跑式台阶：从 yBot 逐级上升到 yTop）
GEOM.stairwells.forEach((s, idx) => {
  const w = s.x1 - s.x0;
  const N = Math.max(1, s.steps);
  const tread = (s.yTop - s.yBot) / N;   // 每级进深（北向）
  for (let i = 0; i < N; i++) {
    const ya = s.yBot + i * tread;
    const yb = s.yBot + (i + 1) * tread;
    const h = 0.15 * (i + 1);            // 每级高 0.15m
    const geo = new THREE.BoxGeometry(w, 0.15, tread);
    const m = new THREE.Mesh(geo, stairMat);
    m.position.set((s.x0 + s.x1) / 2, h - 0.075, -(ya + yb) / 2);
    m.userData = { type: '楼梯', label: `楼梯 #${idx + 1}`, color: '#d0c198' };
    scene.add(m);
  }
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ---------- 点击识别：鼠标指到哪，告诉你是什么构件 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tag = document.getElementById('tag');
const info = document.getElementById('info');
const pickables = [];
scene.traverse((o) => { if (o.isMesh) pickables.push(o); });

// 从后端数据库拉房间信息（编号/名称/面积/用途/单位），按 id 索引
// 本地开发后端在 8123；若静态站与后端同源，改成 '' 即可
const API_BASE = 'http://localhost:8123';
const roomMap = {};
fetch(API_BASE + '/api/rooms?floor=0')
  .then(res => res.json())
  .then(res => { for (const r of (res.data || [])) roomMap[r.id] = r; })
  .catch(err => console.error('加载房间数据失败：', err));

function setRay(ev) {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}

function describeFace(n) {
  const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  if (ay > 0.85) return n.y > 0 ? '顶面（朝上）' : '底面（朝下）';
  if (ax > 0.85) return n.x > 0 ? '东立面' : '西立面';
  if (az > 0.85) return n.z > 0 ? '南立面' : '北立面';
  return '斜/角面';
}

let selected = null, origMat = null;
function select(mesh) {
  clearSelect();
  selected = mesh; origMat = mesh.material;
  const m2 = origMat.clone();
  m2.emissive = new THREE.Color(0x33ff99);
  m2.emissiveIntensity = 0.55;
  mesh.material = m2;
}
function clearSelect() {
  if (!selected) return;
  selected.material.dispose();
  selected.material = origMat;
  selected = null; origMat = null;
}

renderer.domElement.addEventListener('pointermove', (ev) => {
  setRay(ev);
  const hits = raycaster.intersectObjects(pickables, false);
  if (hits.length) {
    const u = hits[0].object.userData;
    tag.style.display = 'block';
    tag.style.left = (ev.clientX + 14) + 'px';
    tag.style.top = (ev.clientY + 14) + 'px';
    tag.textContent = `${u.type} · ${u.label}`;
  } else {
    tag.style.display = 'none';
  }
});

renderer.domElement.addEventListener('click', (ev) => {
  setRay(ev);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) { clearSelect(); info.style.display = 'none'; return; }
  const hit = hits[0];
  const u = hit.object.userData;
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const p = hit.point;
  const room = (u.type === '房间' && u.id != null) ? roomMap[u.id] : null;
  if (room) {
    info.innerHTML =
      `<div class="t">房间 ${room.number || ''}</div>` +
      `<div><b>名称</b> ${room.name || '—'}</div>` +
      `<div><b>面积</b> ${room.area_m2 != null ? room.area_m2.toFixed(2) + ' m²' : (room.area_label || '—')}</div>` +
      (room.area_label ? `<div><b>标注面积</b> ${room.area_label}</div>` : '') +
      `<div><b>用途</b> ${room.purpose || '—'}</div>` +
      `<div><b>使用单位</b> ${room.dept || '—'}</div>` +
      `<div><b>面</b> ${describeFace(n)}</div>` +
      `<div><b>位置</b> x=${p.x.toFixed(2)} y=${p.y.toFixed(2)} z=${p.z.toFixed(2)}</div>` +
      `<div class="tip">数据来自数据库 lihua_twin.rooms</div>`;
  } else {
    info.innerHTML =
      `<div class="t">${u.type}</div>` +
      `<div><b>名称</b> ${u.label}</div>` +
      `<div><b>颜色</b> ${u.color || '-'}</div>` +
      (u.holes != null ? `<div><b>门洞数</b> ${u.holes}</div>` : '') +
      `<div><b>面</b> ${describeFace(n)}</div>` +
      `<div><b>位置</b> x=${p.x.toFixed(2)} y=${p.y.toFixed(2)} z=${p.z.toFixed(2)}</div>` +
      `<div class="tip">把上面的「名称」报给我，就能定位到你看到的东西</div>`;
  }
  info.style.display = 'block';
  select(hit.object);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
