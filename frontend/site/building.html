<!--
  ★ importmap 必须在**任何** module 脚本之前：浏览器在解析第一个 module 前
    就把这张表定下来，之后再声明就不生效了。
  ★ three 走仓内 vendor/（不是 CDN）。本仓记过「查看器硬依赖 CDN」这笔账，
    而呈现页恰恰是最不能白屏的地方。版本 0.185.1，与 node_modules 同一份。
  ★ 用 .min 那一对：three.module.min.js 内部 `from"./three.core.min.js"` ——
    两个文件必须成对搬，少一个就是"模块能解析、一 import 就 404"。
    （非压缩版是 1.4MB，压缩版 751KB；前台是给人看的页面，字节算成本。）
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="site.css">
</head>
